<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ORDINARY DAY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a0d;color:#e6e3dd;font-family:"Segoe UI",Trebuchet MS,Verdana,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{display:block;position:absolute;inset:0;image-rendering:auto}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none !important}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:#14141a}
::-webkit-scrollbar-thumb{background:#3c3c4a;border-radius:5px}

/* ---------- shared screen shell ---------- */
.screen{position:absolute;inset:0;z-index:40;overflow-y:auto;padding:26px 20px 44px;
  background:radial-gradient(120% 90% at 50% 0%,#171622 0%,#0a0a0d 70%)}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:40px;letter-spacing:5px;font-weight:700;color:#f0e9dd;text-align:center;margin-bottom:4px}
h2{font-size:19px;letter-spacing:1.2px;color:#e8c9a0;margin:20px 0 9px;font-weight:600}
h3{font-size:15px;letter-spacing:.6px;color:#cbb9e8;margin:14px 0 6px}
p{line-height:1.62;margin-bottom:11px;font-size:14.5px;color:#c9c5c0}
.sub{text-align:center;color:#8d8a96;letter-spacing:3px;font-size:11.5px;margin-bottom:24px;text-transform:uppercase}
.panel{background:#15151d;border:1px solid #2e2e3c;border-radius:10px;padding:16px 18px;margin-bottom:14px}
.panel.warn{border-color:#6d4a3a;background:#1c1512}
.panel.good{border-color:#3f5c46;background:#121a15}
.panel.teach{border-color:#4a4470;background:#16141f}
.btn{display:block;width:100%;text-align:left;background:#1d1d28;border:1px solid #38384a;
  border-radius:8px;padding:12px 15px;margin-bottom:9px;font-size:14.5px;line-height:1.45;transition:.13s}
.btn:hover{background:#262636;border-color:#5d5d78;transform:translateX(3px)}
.btn small{display:block;color:#8b8798;font-size:12px;margin-top:3px}
.btn.big{text-align:center;font-size:16px;letter-spacing:1.5px;padding:14px;background:#2a2438;border-color:#5b4b78}
.btn.big:hover{background:#372e4b}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:260px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;background:#2a2a38;color:#a5a0b5;margin-right:5px}
.tag.bad{background:#3a2020;color:#e0a0a0}.tag.ok{background:#1f3326;color:#9ed0ae}
ul{margin:0 0 11px 20px}li{line-height:1.6;font-size:14px;color:#c2beb9;margin-bottom:5px}
b{color:#f0e2cc}i{color:#b5aec6}
.small{font-size:12.5px;color:#807d8b;line-height:1.55}
.hr{height:1px;background:#2c2c38;margin:18px 0}

/* ---------- character select ---------- */
.pick{background:#15151f;border:1px solid #33334a;border-radius:12px;padding:0 0 16px;cursor:pointer;
  overflow:hidden;transition:.15s}
.pick:hover{border-color:#7a6aa8;transform:translateY(-4px);box-shadow:0 10px 26px rgba(0,0,0,.55)}
.pick .art{height:150px;display:flex;align-items:flex-end;justify-content:center}
.pick .body{padding:0 16px}
.pick h3{margin-top:12px;font-size:18px;color:#f0e9dd;letter-spacing:.4px}
.pick .age{color:#8d8a96;font-size:12.5px;margin-bottom:8px}

/* ---------- in-game HUD ---------- */
#hud{position:absolute;left:0;top:0;right:0;padding:9px 11px;display:flex;gap:9px;align-items:flex-start;
  flex-wrap:wrap;pointer-events:none;z-index:6;font-size:12px}
.card{background:rgba(10,10,15,.86);border:1px solid #33333f;border-radius:7px;padding:6px 10px;line-height:1.5;
  box-shadow:0 2px 10px rgba(0,0,0,.55)}
.card b{color:#e8c9a0;font-weight:600}
.stat{display:flex;align-items:center;gap:6px;margin:2px 0}
.stat span{width:74px;color:#9b97a6;font-size:11px;letter-spacing:.4px}
.bar{width:88px;height:6px;background:#242430;border:1px solid #3d3d4c;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
#clock{font-size:15px;letter-spacing:2px;color:#f0e2cc}
#chapname{color:#9b93b5;font-size:11px;letter-spacing:1.6px;text-transform:uppercase}
#toll{color:#c9a6a6}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:6;
  background:rgba(10,10,15,.9);border:1px solid #4a4458;border-radius:20px;padding:7px 16px;
  font-size:13px;letter-spacing:.6px;pointer-events:none;color:#e0dae8}
#prompt b{color:#f3d98b}

/* ---------- dialogue ---------- */
#dlg{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 14px 14px;pointer-events:none}
#dlgin{max-width:840px;margin:0 auto;pointer-events:auto}
#who{display:inline-block;background:#3a3050;border:1px solid #5f4f80;border-bottom:none;
  border-radius:8px 8px 0 0;padding:5px 15px;font-size:13px;letter-spacing:1px;color:#f0e2cc;font-weight:600}
#body{background:rgba(13,13,19,.96);border:1px solid #47415a;border-radius:0 10px 10px 10px;padding:15px 18px;
  min-height:82px;font-size:15.5px;line-height:1.68;color:#ded9e4}
#body.narr{color:#a8a3b8;font-style:italic;border-radius:10px}
#choices{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.ch{background:rgba(24,22,34,.96);border:1px solid #40394f;border-radius:7px;padding:10px 13px;font-size:14px;
  line-height:1.45;transition:.11s;text-align:left;width:100%}
.ch:hover{background:#2c2740;border-color:#7b6aa8;transform:translateX(4px)}
.ch .k{color:#f3d98b;font-weight:700;margin-right:8px}
.ch em{color:#8f8aa0;font-style:normal;font-size:12px;display:block;margin:3px 0 0 22px}
#cont{margin-top:8px;text-align:right;color:#7d7890;font-size:12px;letter-spacing:1px}

/* ---------- teach card ---------- */
#teach{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:rgba(6,6,10,.86);padding:22px}
#teachin{max-width:590px;background:#16141f;border:1px solid #574d80;border-radius:12px;padding:20px 23px;
  box-shadow:0 16px 50px rgba(0,0,0,.7)}
#teachin .lbl{font-size:10.5px;letter-spacing:3px;color:#a08fd0;text-transform:uppercase;margin-bottom:9px}
#teachin p{font-size:14.5px;color:#d3cfd9}
#vig{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>

<div id="hud" class="hidden">
  <div class="card"><div id="clock">7:12 AM</div><div id="chapname">Chapter One</div></div>
  <div class="card" id="stats"></div>
  <div class="card"><div style="color:#9b97a6;font-size:11px;letter-spacing:.4px">INVISIBLE LABOR</div>
    <div id="toll" style="font-size:15px">0</div></div>
  <div class="card" id="docscard" style="display:none"><div style="color:#9b97a6;font-size:11px">DOCUMENTED</div>
    <div id="docsn" style="font-size:15px;color:#9ed0ae">0</div></div>
</div>
<div id="prompt" class="hidden"></div>

<div id="dlg" class="hidden"><div id="dlgin">
  <div id="who"></div>
  <div id="body"></div>
  <div id="choices"></div>
  <div id="cont" class="hidden">SPACE / CLICK  ▸</div>
</div></div>

<div id="teach" class="hidden"><div id="teachin">
  <div class="lbl">Why this matters</div>
  <p id="teachtx"></p>
  <button class="btn big" id="teachok" style="margin-top:14px">CONTINUE</button>
</div></div>

<div id="scr" class="screen"></div>

<script>
"use strict";
/* ================================================================
   ORDINARY DAY  —  an educational game about a day in a woman's life
   Single-file HTML5 canvas.  No external assets.
   ================================================================ */

const CV=document.getElementById('cv'), X=CV.getContext('2d');
const $=id=>document.getElementById(id);
const SCR=$('scr'), DLG=$('dlg'), HUD=$('hud'), PROMPT=$('prompt'), VIG=$('vig');
const VW=960, VH=540;              // logical resolution
let scale=1, ox=0, oy=0;

function resize(){
  const w=innerWidth,h=innerHeight;
  CV.width=w; CV.height=h;
  scale=Math.min(w/VW,h/VH); ox=(w-VW*scale)/2; oy=(h-VH*scale)/2;
}
addEventListener('resize',resize); resize();

/* ---------------- global state ---------------- */
const S={
  who:null,            // 'maya' | 'diane'
  mode:'title',        // title | play | dialogue | screen
  room:null, rooms:null, story:null,
  px:0,py:0,pvx:0,pvy:0,facing:1, walkT:0,
  composure:8, standing:6, support:2, exposure:0, toll:0, docs:0,
  flags:{}, clock:0, chapter:'',
  node:null, page:0, pages:[], typed:0, typing:false,
  watchers:0,           // NPCs currently staring -> vignette
  endingsFound: JSON.parse(localStorage.getItem('od_endings')||'{}'),
  fade:0, fadeDir:0, fadeCb:null,
  shake:0
};
const F=k=>!!S.flags[k];
const setF=k=>{S.flags[k]=true;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------------- input ---------------- */
const K={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  K[e.key.toLowerCase()]=true;
  if(S.mode==='dialogue') dlgKey(e);
  else if(S.mode==='play'&&(e.key==='e'||e.key==='E'||e.key===' ')) tryInteract();
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false;});
CV.addEventListener('click',()=>{ if(S.mode==='dialogue'&&!S.choicesOpen) dlgAdvance(); });

/* ================================================================
   ART HELPERS — everything drawn from primitives
   ================================================================ */
function rr(x,y,w,h,r,col){X.fillStyle=col;X.beginPath();X.roundRect(x,y,w,h,r);X.fill();}
function rect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h);}

/* a person: head, hair, torso, legs. dir: -1 left, 1 right */
function drawPerson(p,t){
  const x=p.x,y=p.y, s=p.s||1, bob=p.moving?Math.sin(t*11)*1.4:0;
  // shadow
  X.fillStyle='rgba(0,0,0,.34)';X.beginPath();
  X.ellipse(x,y+2,10*s,4*s,0,0,7);X.fill();
  const bh=22*s, bw=13*s;
  // legs
  const sw=p.moving?Math.sin(t*11)*3.4*s:0;
  rect(x-4.6*s,y-9*s,3.6*s,9*s+sw*0.5,p.leg||'#2c2c3c');
  rect(x+1*s,y-9*s,3.6*s,9*s-sw*0.5,p.leg||'#2c2c3c');
  // torso
  rr(x-bw/2,y-bh-9*s+bob,bw,bh,3*s,p.top||'#7a6aa8');
  // arms
  rect(x-bw/2-2.6*s,y-bh-6*s+bob,2.6*s,13*s,p.skin||'#c58f6a');
  rect(x+bw/2,y-bh-6*s+bob,2.6*s,13*s,p.skin||'#c58f6a');
  // head
  const hy=y-bh-9*s-7.4*s+bob;
  X.fillStyle=p.skin||'#c58f6a';X.beginPath();X.arc(x,hy,7.4*s,0,7);X.fill();
  // hair
  X.fillStyle=p.hair||'#2a1c18';
  X.beginPath();X.arc(x,hy-1.1*s,7.7*s,Math.PI*(p.bald?1.15:1.02),Math.PI*(p.bald?1.85:1.98));X.fill();
  if(p.long){ rr(x-8*s,hy-2*s,16*s,15*s,5*s,p.hair||'#2a1c18');
              X.fillStyle=p.skin||'#c58f6a';X.beginPath();X.arc(x,hy,6.4*s,0,7);X.fill();
              X.fillStyle=p.hair||'#2a1c18';
              X.beginPath();X.arc(x,hy-1.4*s,7.1*s,Math.PI*1.02,Math.PI*1.98);X.fill(); }
  // eyes (direction)
  const ed=(p.dir||1)*2.1*s;
  rect(x-2.6*s+ed,hy-1*s,1.7*s,2.1*s,'#16121c');
  rect(x+1.1*s+ed,hy-1*s,1.7*s,2.1*s,'#16121c');
  // "being watched" marker
  if(p.staring){
    X.globalAlpha=.42+Math.sin(t*3)*.18;
    X.strokeStyle='#e0a0a0';X.lineWidth=1.4;
    X.beginPath();X.moveTo(x,hy-13*s);X.lineTo(x-4*s,hy-18*s);X.lineTo(x+4*s,hy-18*s);X.closePath();X.stroke();
    X.globalAlpha=1;
  }
}

function drawProp(o,t){
  const c=o.col||'#3a3446';
  switch(o.type){
    case 'bed': rr(o.x,o.y,o.w,o.h,4,'#4a3f58'); rr(o.x+3,o.y+3,o.w-6,o.h*0.32,3,'#cbbfd8');
                rr(o.x+3,o.y+o.h*0.38,o.w-6,o.h*0.58,3,'#6b5a86'); break;
    case 'desk': rr(o.x,o.y,o.w,o.h,3,'#5a4636'); rr(o.x+4,o.y+3,o.w-8,o.h-9,2,'#6b5442'); break;
    case 'screen': rr(o.x,o.y,o.w,o.h,2,'#22222e'); rr(o.x+2,o.y+2,o.w-4,o.h-6,1,'#3d5a6b');
                   X.globalAlpha=.4+Math.sin(t*2)*.08; rr(o.x+2,o.y+2,o.w-4,o.h-6,1,'#7fb4cc'); X.globalAlpha=1; break;
    case 'closet': rr(o.x,o.y,o.w,o.h,3,'#4a3b52'); rect(o.x+o.w/2-1,o.y+3,2,o.h-6,'#2b2233'); break;
    case 'mirror': rr(o.x,o.y,o.w,o.h,3,'#8f86a8'); rr(o.x+3,o.y+3,o.w-6,o.h-6,2,'#5c6a80'); break;
    case 'seat': rr(o.x,o.y,o.w,o.h,3,'#3d4a5c'); rr(o.x+2,o.y+2,o.w-4,4,2,'#54637a'); break;
    case 'table': rr(o.x,o.y,o.w,o.h,5,'#54432f'); rr(o.x+3,o.y+3,o.w-6,o.h-6,4,'#6a563c'); break;
    case 'locker': for(let i=0;i<o.w;i+=22){rr(o.x+i,o.y,20,o.h,2,'#3f5a58');rect(o.x+i+15,o.y+o.h*0.4,2,5,'#22322f');} break;
    case 'plant': rect(o.x+o.w/2-4,o.y+o.h-10,8,10,'#5a4636');
                  X.fillStyle='#3f6b47';
                  X.beginPath();X.arc(o.x+o.w/2,o.y+o.h-14,o.w/2,0,7);X.fill(); break;
    case 'counter': rr(o.x,o.y,o.w,o.h,3,'#4c4256'); rect(o.x,o.y,o.w,4,'#6c6078'); break;
    case 'car': rr(o.x,o.y,o.w,o.h,7,o.col||'#5b2b2b'); rr(o.x+6,o.y+5,o.w-12,o.h*0.4,4,'#1d2430');
                rect(o.x+2,o.y+o.h-4,7,4,'#e8d9a0'); rect(o.x+o.w-9,o.y+o.h-4,7,4,'#e8d9a0'); break;
    case 'bar': rr(o.x,o.y,o.w,o.h,4,'#3d2c22'); rect(o.x,o.y,o.w,5,'#6b4f3a'); break;
    default: rr(o.x,o.y,o.w,o.h,3,c);
  }
}

/* ================================================================
   WORLD  — rooms, movement, collision, interaction
   ================================================================ */
let cam={x:0,y:0};

function room(){ return S.rooms[S.room]; }

function enterRoom(id,sx,sy){
  S.room=id; const r=room();
  S.px = sx!=null?sx:r.spawn[0]; S.py = sy!=null?sy:r.spawn[1];
  cam.x=0;cam.y=0;
  if(r.onEnter && !F('entered_'+id)){ setF('entered_'+id); const n=r.onEnter; setTimeout(()=>startNode(n),260); }
}

function solids(){
  const r=room(); const out=[];
  for(const w of r.walls) out.push(w);
  for(const p of r.props) if(p.solid!==false) out.push([p.x,p.y,p.w,p.h]);
  for(const n of r.npcs) if(!n.gone) out.push([n.x-9,n.y-8,18,10]);
  return out;
}
function hits(x,y,list){
  const hw=7,hh=6;
  for(const b of list) if(x+hw>b[0]&&x-hw<b[0]+b[2]&&y+hh>b[1]&&y-hh<b[1]+b[3]) return true;
  return false;
}

function movePlayer(dt){
  const sp=118*dt; let dx=0,dy=0;
  if(K['arrowleft']||K['a'])dx-=1; if(K['arrowright']||K['d'])dx+=1;
  if(K['arrowup']||K['w'])dy-=1;   if(K['arrowdown']||K['s'])dy+=1;
  if(dx&&dy){dx*=.707;dy*=.707;}
  if(dx)S.facing=dx>0?1:-1;
  const sol=solids();
  const nx=S.px+dx*sp, ny=S.py+dy*sp;
  if(!hits(nx,S.py,sol)) S.px=nx;
  if(!hits(S.px,ny,sol)) S.py=ny;
  const r=room();
  S.px=clamp(S.px,10,r.w-10); S.py=clamp(S.py,16,r.h-4);
  S.moving=!!(dx||dy);
  // exits
  for(const e of r.exits){
    if(e.locked&&!F(e.locked===true?'never':e.locked)) continue;
    if(e.requires&&!F(e.requires)) continue;
    if(S.px>e.x&&S.px<e.x+e.w&&S.py>e.y&&S.py<e.y+e.h){
      if(e.node){ if(e._fired) continue; e._fired=true; const n=e.node; startNode(n); return; }
      fadeTo(()=>enterRoom(e.to,e.spawn?e.spawn[0]:null,e.spawn?e.spawn[1]:null));
      return;
    }
  }
}

function nearest(){
  const r=room(); let best=null,bd=34;
  for(const n of r.npcs){
    if(n.gone||!n.node) continue;
    if(n.requires&&!F(n.requires)) continue;
    const d=Math.hypot(n.x-S.px,n.y-8-S.py); if(d<bd){bd=d;best={t:'npc',o:n};}
  }
  for(const o of r.things||[]){
    if(o.once&&F('used_'+o.id)) continue;
    if(o.requires&&!F(o.requires)) continue;
    const cx=o.x+o.w/2, cy=o.y+o.h/2;
    const d=Math.hypot(cx-S.px,cy-S.py); if(d<bd){bd=d;best={t:'thing',o:o};}
  }
  return best;
}
function tryInteract(){
  const n=nearest(); if(!n) return;
  if(n.t==='thing'&&n.o.once) setF('used_'+n.o.id);
  startNode(n.o.node);
}

function drawRoom(t){
  const r=room();
  // camera
  const cw=Math.min(VW,r.w), chh=Math.min(VH,r.h);
  cam.x = r.w>VW ? clamp(S.px-VW/2,0,r.w-VW) : -(VW-r.w)/2;
  cam.y = r.h>VH ? clamp(S.py-VH/2,0,r.h-VH) : -(VH-r.h)/2;
  X.save(); X.translate(-cam.x,-cam.y);
  // floor
  rect(0,0,r.w,r.h,r.floor||'#2b2733');
  if(r.tile!==false){
    X.strokeStyle='rgba(255,255,255,.035)';X.lineWidth=1;
    for(let i=0;i<r.w;i+=40){X.beginPath();X.moveTo(i,0);X.lineTo(i,r.h);X.stroke();}
    for(let j=0;j<r.h;j+=40){X.beginPath();X.moveTo(0,j);X.lineTo(r.w,j);X.stroke();}
  }
  // exits glow
  for(const e of r.exits){
    if(e.requires&&!F(e.requires)) continue;
    X.fillStyle='rgba(240,220,150,'+(0.07+Math.sin(t*2)*0.03)+')';
    X.fillRect(e.x,e.y,e.w,e.h);
    if(e.label){X.fillStyle='rgba(240,226,204,.55)';X.font='11px Segoe UI';X.textAlign='center';
      X.fillText(e.label,e.x+e.w/2,e.y+e.h/2+4);X.textAlign='left';}
  }
  // walls
  for(const w of r.walls) rr(w[0],w[1],w[2],w[3],2,r.wallCol||'#1e1a26');
  // props + npcs + player sorted by y
  const ents=[];
  for(const p of r.props) ents.push({y:p.y+p.h,d:()=>drawProp(p,t)});
  for(const n of r.npcs){
    if(n.gone) continue; if(n.requires&&!F(n.requires)) continue;
    n.staring = n.watch && Math.hypot(n.x-S.px,n.y-S.py)<190;
    ents.push({y:n.y,d:()=>{drawPerson(n,t);
      X.fillStyle='rgba(232,226,204,.72)';X.font='10.5px Segoe UI';X.textAlign='center';
      X.fillText(n.label||n.name,n.x,n.y-46);X.textAlign='left';}});
  }
  const pc={x:S.px,y:S.py,dir:S.facing,moving:S.moving,...S.look};
  ents.push({y:S.py,d:()=>drawPerson(pc,t)});
  ents.sort((a,b)=>a.y-b.y); for(const e of ents) e.d();
  X.restore();
  // watched vignette

    PROMPT.innerHTML='<b>E</b> &nbsp;'+(nr.t==='npc'?('Talk to '+(nr.o.name)):(nr.o.label||'Examine'));}

/* ---------------- fade ---------------- */
function fadeTo(cb){ S.fadeDir=1; S.fadeCb=cb; }
function drawFade(dt){
  if(S.fadeDir===1){ S.fade=Math.min(1,S.fade+dt*3.2); if(S.fade>=1){S.fadeDir=-1; if(S.fadeCb){S.fadeCb();S.fadeCb=null;} } }
  else if(S.fadeDir===-1){ S.fade=Math.max(0,S.fade-dt*2.4); if(S.fade<=0)S.fadeDir=0; }
  if(S.fade>0){ X.save();X.setTransform(1,0,0,1,0,0);
    X.fillStyle='rgba(4,4,7,'+S.fade+')';X.fillRect(0,0,CV.width,CV.height);X.restore(); }
}

const STATDEF=[
  ['composure','Composure','#8fbfd0',10],
  ['standing','Standing','#d0b98f',10],
  ['support','Support','#9ed0ae',6],
  ['exposure','Exposure','#d08f8f',10]
];
function drawHUD(){
  $('clock').textContent=clockStr();
  $('chapname').textContent=S.chapter;
  $('toll').textContent=S.toll+' acts';
  let h='';
  for(const [k,lbl,col,max] of STATDEF){
    const v=clamp(S[k],0,max), pc=(v/max*100).toFixed(0);
    h+=`<div class="stat"><span>${lbl}</span><div class="bar"><i style="width:${pc}%;background:${col}"></i></div></div>`;
  }
  $('stats').innerHTML=h;
  if(S.who==='diane'){ $('docscard').style.display=''; $('docsn').textContent=S.docs; }
}
function clockStr(){
  const base=S.who==='maya'?432:410;   // 7:12am / 6:50am
  const m=base+S.clock, hh=Math.floor(m/60)%24, mm=m%60;
  const ap=hh<12?'AM':'PM'; const h12=hh%12===0?12:hh%12;
  return h12+':'+String(mm).padStart(2,'0')+' '+ap;
}

/* ================================================================
   DIALOGUE ENGINE
   node = { who, text|[pages], fx, choices:[{t,to,fx,if,not,note}], to,
            teach, end, go:{room,spawn}, act }
   ================================================================ */
function N(id){ const n=S.story[id]; if(!n) console.warn('missing node',id); return n; }

function applyFx(fx){
  if(!fx) return;
  for(const k of ['composure','standing','support','exposure','toll','docs'])
    if(fx[k]!=null) S[k]=Math.max(0,S[k]+fx[k]);
  if(fx.time) S.clock+=fx.time;
  if(fx.flag) (Array.isArray(fx.flag)?fx.flag:[fx.flag]).forEach(setF);
  if(fx.clear) (Array.isArray(fx.clear)?fx.clear:[fx.clear]).forEach(f=>{delete S.flags[f];});
  if(fx.gone) { const r=room(); const n=r.npcs.find(n=>n.id===fx.gone); if(n)n.gone=true; }
  if(fx.watch!=null){ const r=room(); const n=r.npcs.find(n=>n.id===fx.watch); if(n)n.watch=true; }
  if(fx.unwatch){ const r=room(); const n=r.npcs.find(n=>n.id===fx.unwatch); if(n)n.watch=false; }
}

function startNode(id){
  const n=N(id); if(!n) return;
  S.node=id; S.mode='dialogue'; S.choicesOpen=false;
  applyFx(n.fx);
  if(n.chapter) S.chapter=n.chapter;
  S.pages = resolvePages(n.text!=null?n.text:"");
  S.page=0; DLG.classList.remove('hidden'); PROMPT.classList.add('hidden');
  showPage();
}
function showPage(){
  const n=N(S.node);
  const speaker = n.who===undefined?null:n.who;
  const w=$('who');
  if(speaker){ w.style.display=''; w.textContent=typeof speaker==='function'?speaker():speaker;
               w.style.background=SPKCOL[speaker]||'#3a3050'; $('body').className=''; }
  else { w.style.display='none'; $('body').className='narr'; }
  const txt=S.pages[S.page]||'';
  S.typed=0; S.typing=true; S.rawtext=txt;
  $('choices').innerHTML=''; $('cont').classList.add('hidden'); S.choicesOpen=false;
  tick_type();
}
let typeTimer=null;
function tick_type(){
  clearTimeout(typeTimer);
  if(S.typed>=S.rawtext.length){ S.typing=false; afterText(); return; }
  S.typed+=2;
  { let s=S.rawtext.slice(0,S.typed), c=0; for(let i=0;i<s.length;i++) if(s.charAt(i)==='*') c++; if(c%2) s+='*'; $('body').innerHTML=fmt(s); }
  typeTimer=setTimeout(tick_type,11);
}
function fmt(s){ return s.replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\|/g,'<br>'); }
function finishTyping(){ clearTimeout(typeTimer); S.typed=S.rawtext.length; S.typing=false;
  $('body').innerHTML=fmt(S.rawtext); afterText(); }

function afterText(){
  const n=N(S.node);
  if(S.page < S.pages.length-1){ $('cont').classList.remove('hidden'); return; }
  // last page -> choices or continue
  const chs=(n.choices||[]).filter(c=>{
    if(c.if && !(Array.isArray(c.if)?c.if.every(F):F(c.if))) return false;
    if(c.not && (Array.isArray(c.not)?c.not.some(F):F(c.not))) return false;
    if(c.min && S[c.min[0]]<c.min[1]) return false;
    if(c.max && S[c.max[0]]>=c.max[1]) return false;
    return true;
  });
  if(chs.length){
    S.choicesOpen=true;
    const box=$('choices'); box.innerHTML='';
    chs.forEach((c,i)=>{
      const b=document.createElement('button'); b.className='ch';
      b.innerHTML='<span class="k">'+(i+1)+'</span>'+fmt(c.t)+(c.note?'<em>'+c.note+'</em>':'');
      b.onclick=()=>pick(c); box.appendChild(b);
    });
    S.curChoices=chs;
  } else { $('cont').classList.remove('hidden'); }
}
function pick(c){
  S.choicesOpen=false; $('choices').innerHTML='';
  applyFx(c.fx);
  if(c.act) c.act();
  goNext(c.to || N(S.node).to);
}
function dlgAdvance(){
  if(S.typing){ finishTyping(); return; }
  if(S.choicesOpen) return;
  if(S.page < S.pages.length-1){ S.page++; showPage(); return; }
  const n=N(S.node);
  goNext(n.to);
}
function dlgKey(e){
  if(e.key===' '||e.key==='Enter'){ if(!S.choicesOpen) dlgAdvance(); return; }
  if(S.choicesOpen&&/^[1-9]$/.test(e.key)){
    const i=+e.key-1; if(S.curChoices[i]) pick(S.curChoices[i]);
  }
}
function goNext(to){
  const n=N(S.node);
  const finish=()=>{
    if(n.act) n.act();
    if(n.end){ closeDlg(); showEnding(n.end); return; }
    if(n.go){ closeDlg(); fadeTo(()=>enterRoom(n.go.room,n.go.spawn?n.go.spawn[0]:null,n.go.spawn?n.go.spawn[1]:null));
              if(n.go.then) setTimeout(()=>startNode(n.go.then),700); return; }
    if(to){ startNode(to); return; }
    closeDlg();
  };
  if(n.teach){ showTeach(n.teach,finish); } else finish();
}
function closeDlg(){ DLG.classList.add('hidden'); S.mode='play'; S.node=null; }

function showTeach(txt,cb){
  $('teachtx').innerHTML=fmt(txt);
  $('teach').classList.remove('hidden');
  $('teachok').onclick=()=>{ $('teach').classList.add('hidden'); cb(); };
}

 fx:{composure:1,support:1,flag:'spoke_up'}, to:'m_bus_end',
 teach:"Volume is one of the more effective tools available, because harassment depends on quiet. It also reliably recasts the victim as the person who \"caused a scene.\" Both are true at once. If you are ever the audience for this scene: <b>make it obvious whose side you are on, immediately.</b>" };
MAYA.m_bus_adey_ask={ who:'Mrs. Adeyemi',
 text:["*You stand up and say it fast, before you can talk yourself out of it: \"Can I sit with you?\"*",
       "*She has your arm before you finish the sentence.*","Sit. Sit down, baby. *(louder, not to you)* Some people were not raised right.",
       "*He gets off two stops early.*"],
 fx:{composure:2,support:2,exposure:-2,flag:'asked_help'}, to:'m_bus_end',
 teach:"Notice what worked: <b>a direct request to one specific person.</b> Bystanders freeze in ambiguity - twenty people each hoping someone else moves. Naming one human being out loud collapses that instantly. \"Can I sit with you?\" is a complete safety plan." };
MAYA.m_bus_driver_tell={ who:'Bus driver',
 text:["*You lean over the yellow line.*","*He does not look away from the road.*","I cannot do nothing unless he touches you. Sit up front if you want.",
       "*You sit up front. It is better. It also is not nothing.*"],
 fx:{exposure:-1,composure:-1,toll:1}, to:'m_bus_end',
 teach:"\"I cannot do anything unless\" is a sentence women hear from institutions their whole lives - transit, schools, HR, police. The threshold for action is almost always set <b>just past</b> the point where acting would have helped." };
MAYA.m_bus_off_early={ who:null,
 text:["*You get off nine blocks early and walk. It is fine. It is twenty minutes. You will be late and you will get a tardy for it.*",
       "*You check behind you four times.*"],
 fx:{flag:'late'}, to:'m_bus_end',
 teach:"This is the tax. Not the incident - the <b>rerouting</b>. Leaving early, the longer way, the ride you cannot afford, the thing you missed. It never appears in any statistic, because nothing happened." };

MAYA.m_adey={ who:'Mrs. Adeyemi',

MAYA.m_driver={ who:'Bus driver', text:"*He is watching the road. He does eleven hours of this a day.*"};
MAYA.m_headphones={ who:null, text:"*A boy your age. Headphones on. He saw the whole thing at the bus stop.*|*He turns his music up.*",
 teach:"Passive bystanders are usually not villains - they are scared, unsure, or certain that someone else will handle it. The fix is specific and teachable: the <b>5 D's</b> - Direct (say something), Distract (\"hey, is this the 14?\"), Delegate (get the driver), Delay (check on her afterward), Document (film from a distance). Distract is the safest and works startlingly well." };

MAYA.m_alv_why={ who:'Ms. Alvarez', text:["*A flicker of something - she knows. She has known for thirty years.*","...Just get to class, Maya."], to:'m_alv_end'};
MAYA.m_alv_bus={ who:'Ms. Alvarez',
 text:["*You tell her about the grey jacket. About the seat. About this morning.*",
       "*She listens. She really does listen.*","That is off campus, sweetheart. I cannot do anything about off campus.| Do you want a late pass?"],

MAYA.m_alv_end={ who:null, fx:{flag:'dresscoded'},

MAYA.m_jordan1={ who:'Jordan Vale',
 text:["*Jordan Vale. Senior, plays midfield, gets called 'a good kid' by adults who have never watched him work a hallway.*",

MAYA.m_jor_duck={ who:'Jordan Vale', text:["*He puts both hands up, grinning at two friends who are watching.*","Damn. Okay. Cold.| ...I am just being NICE to you, Maya."],

MAYA.m_jor_laugh={ who:null, text:["*You laugh. He keeps the arm there for another eleven seconds and you count all of them.*|*It is easier. It is always easier, right up until it is not.*"],

MAYA.m_jor_text={ who:'Jordan Vale', text:["*Something moves behind his eyes, fast.*","Bro, I do not even know what you are talking about.| ...That is kind of crazy, Maya. You are kind of crazy."],

  {t:"\"Thank you, sir.\" Stay. He is being nice.",to:'m_hal_stay',fx:{flag:'hal_warm',exposure:2}},

MAYA.m_hal_leave={ who:'Mr. Halberd', text:["*He follows you to the door. He does not touch you. He never touches you - that is the whole architecture of it.*","Door is always open for you, Maya."],
 to:'m_hal_offer'};
MAYA.m_hal_stay={ who:'Mr. Halberd',
 text:["*He tells you about his divorce. He tells you his wife never understood him either.*",
       "I feel like I can talk to you. Which is - I know how that sounds. Do not tell anyone I said that.",
       "*A secret. He has given you a secret. That is the point of the secret.*"],
 fx:{flag:'hal_secret',exposure:3}, to:'m_hal_offer',
 teach:"That is <b>grooming</b>, and every step is deniable on its own: singling out, flattery about maturity, an adult problem shared with a child, and a request for secrecy. The secrecy is the load-bearing piece - it builds a private world with no witnesses, and it is installed long before anything happens that a court would recognize." };
MAYA.m_hal_ask={ who:'Mr. Halberd',
 text:["*A beat. Then an easy laugh, and a small hurt look, perfectly calibrated.*",
       "Wow. I am trying to help a student who is smarter than this school deserves.| But sure. I will stop."],
 fx:{flag:'hal_named'}, to:'m_hal_offer',
 teach:"Naming the pattern out loud is the thing groomers cannot survive, so the reflex is wounded innocence - which makes the child feel cruel for noticing. <b>Feeling guilty for asking a reasonable question is itself a warning sign.</b>" };
MAYA.m_hal_offer={ who:'Mr. Halberd',

MAYA.m_hal_gave={ who:null, text:"*You give it to him. It is not a big deal. Half the debate team has it. He texts you at 9:14 that night and again at 11:02.*",
 to:'m_hal_out'};
MAYA.m_hal_no={ who:'Mr. Halberd', text:["*The warmth cools by exactly two degrees.*","Sure. Of course."], to:'m_hal_out',

MAYA.m_hal_no2={ who:'Mr. Halberd', text:["*He blinks.*","...Alright."], to:'m_hal_out',

MAYA.m_pri_hal={ who:'Priya',
 text:["*You say it out loud for the first time and it sounds worse out loud.*",

MAYA.m_car_turn={ who:'Jordan Vale', text:["Chill, I am getting gas.","*The gas station is behind you.*"],
 choices:[{t:"\"STOP THE CAR.\"",to:'m_car_stop'},{t:"Okay. Okay. It is fine.",to:'m_car_quiet',fx:{exposure:3}}]};
MAYA.m_car_text={ who:null, fx:{flag:'sent_location'},
 text:["*You drop a pin and send it without looking down. Priya replies in four seconds: 'who r u with'. You type his name.*",
       "*Jordan sees you typing. Something recalculates behind his face, and he takes the next left back toward Cordell.*"],
 to:'m_car_out',
 teach:"Two things happened there, and both are real: her friend now knows where she is, <b>and he knows that her friend knows.</b> Location sharing is not just evidence after the fact - it changes the math for the person deciding whether to try something." };
MAYA.m_car_stop={ who:'Jordan Vale',
 text:["*You say it in a voice that does not sound like yours.*","Jesus - fine. FINE. God, you are dramatic.",
       "*He pulls over hard. You are eleven blocks from home. You get out and your legs are shaking and you are safe.*"],
 fx:{composure:1,flag:'got_out'}, to:'m_car_out',
 teach:"She will spend tonight wondering if she overreacted, and there is no version of this where she gets to know. <b>That uncertainty is the cost of a system where the safe move always looks rude.</b> Getting out of a car eleven blocks early is not an overreaction. It is a fire drill, and fire drills are supposed to be unnecessary." };
MAYA.m_car_out={ who:null, text:"*You walk. You watch his tail lights until they turn.*", go:{room:'night_street',spawn:[60,220]} };
MAYA.m_car_quiet={ who:null, fx:{exposure:4},
 text:["*You do not make it weird. You have been trained since birth not to make it weird.*",
       "*He takes the ramp onto the county road. The houses stop. He turns the radio up and puts a hand on your knee and says 'relax'.*"],
 choices:[
  {t:"Scream. Grab the wheel. Anything.",to:'m_ride_end'},
  {t:"Freeze.",to:'m_ride_end'},
  {t:"\"My mum is tracking my phone.\"",if:'told_mom',to:'m_car_mum'}]};
MAYA.m_car_mum={ who:'Jordan Vale', fx:{flag:'got_out'},
 text:["*It is not even true. He does not know that.*","*He takes his hand back. He drives four more minutes in total silence and drops you at the end of your street without looking at you.*",
       "Do not be weird about this."],
 to:'m_car_out',
 teach:"It worked because he believed <b>someone was watching.</b> Note the sentence she had to invent, and that a lie about surveillance was the strongest tool available to a sixteen-year-old in a moving car. That is worth being angry about." };
MAYA.m_ride_end={ who:null, text:["*The car does not stop.*"], end:'ride' };

MAYA.m_after_priya={ who:'Priya',
 text:["Walk with me? My mum is doing that thing where she makes too much food.| Or - Brandt's later. Together, though. Not you turning up alone like a lamb."],
 choices:[
  {t:"Go to Priya's. Skip the party entirely.",to:'m_priya_house'},
  {t:"Go to the party together.",to:'m_party_together',fx:{support:2,flag:'party_with_priya'}},
  {t:"\"I will meet you there later.\"",to:'m_party_alone',fx:{flag:'party_alone'}}]};
MAYA.m_priya_house={ who:null, fx:{time:300,flag:'safe_evening'},
 text:["*Priya's mother feeds you until you cannot move and asks you three questions about school and one about how you are actually doing.*",
       "*You go home at nine. Priya's mum drives you the four blocks, which is absurd, and you are grateful, which is also absurd.*"],
 to:'m_resolve' };
MAYA.m_party_together={ who:null, fx:{time:280}, text:"*You go home, change, and meet Priya at the corner at eight. She links her arm through yours.*",
 go:{room:'party',spawn:[100,370]} };
MAYA.m_party_alone={ who:null, fx:{time:280,exposure:2}, text:"*You tell yourself you will find her when you get there.*",
 go:{room:'party',spawn:[100,370]} };

MAYA.m_walk_home={ who:null,
 text:"*The gate. Nine blocks between here and your front door, and the whole evening after that.*",
 choices:[
  {t:"Walk home alone.",to:'m_walk_go'},

  {t:"Wait. Go back.",to:'m_nothing_happens'}]};

MAYA.m_walk_go={ who:null, fx:{time:290}, text:["*You walk. You get home. You do homework you do not finish and eat cereal for dinner.*",
  "*At 9:20 you realise you left your charger in your locker, and the corner store is open until ten anyway.*"],

/* ---------- the party ---------- */
MAYA.m_party1={ chapter:"Chapter Four - 8:10 PM", who:null,
 text:["*Brandt's basement. Forty people, music too loud to talk under, someone's older brother bought everything.*",
       ()=> F('party_with_priya') ? "*Priya is somewhere behind you arguing about a song. You can hear her.*"
                                  : "*You cannot find Priya. Her phone is on silent in her bag somewhere.*"] };

MAYA.m_cup={ who:'Jordan Vale',
 text:["*A red cup appears in front of you. Jordan is holding it. You did not see it poured.*","Here. I got you."],
 choices:[
  {t:"Take it and drink it.",to:'m_cup_drink',fx:{exposure:4}},
  {t:"\"I am good, thanks.\" Get your own from the tap.",to:'m_cup_no',fx:{composure:1}},
  {t:"Take it, hold it, do not drink it.",to:'m_cup_hold',fx:{toll:2}}]};
MAYA.m_cup_drink={ who:null, fx:{flag:'drank'},
 text:["*It is sweet and it is strong and about twenty minutes later the room develops a slight lag, like a bad video call.*"],
 teach:"Drink-spiking is real but it is also, statistically, the less common route - <b>far more assaults involve simply waiting for someone to be drunk enough</b>, which requires no drugs and carries no evidence. Either way the responsibility sits with the person who decided to use the state of another human being. Not with the cup." };
MAYA.m_cup_no={ who:'Jordan Vale', text:["*A flat second.*","Suit yourself.","*He drinks it himself, which proves nothing, and you both know that too.*"],
 fx:{flag:'own_drink'} };
MAYA.m_cup_hold={ who:null, text:"*You hold it for an hour so that nobody asks why you are not drinking. It is a prop. This is a normal thing to have to do.*",
 fx:{flag:'own_drink'} };

MAYA.m_party_jordan={ who:'Jordan Vale',
 text:[()=> F('drank') ? "*He appears at your elbow at exactly the moment the room starts to lag.*"
                       : "*He appears at your elbow.*",
       "It is loud down here. Come upstairs, I want to show you something.| Two minutes. Come on."],
 choices:[
  {t:"Go upstairs with him.",to:'m_upstairs_go'},
  {t:"\"Show me here.\"",to:'m_up_no',fx:{composure:1,exposure:1}},
  {t:"\"Only if Priya comes.\"",if:'party_with_priya',to:'m_up_priya',fx:{support:1}},
  {t:"Leave the party. Right now.",to:'m_party_leave'}]};
MAYA.m_up_no={ who:'Jordan Vale', text:["*He laughs, but it does not reach anything.*","You are exhausting, you know that?"], fx:{flag:'jordan_refused'} };
MAYA.m_up_priya={ who:'Priya', text:["*Priya materialises at your shoulder like she was summoned.*","Great, I love things. What are we looking at, Jordan?",
       "*He does not have a thing. He was never going to have a thing.*"],
 fx:{gone:'jordan3',composure:2},
 teach:"The buddy system is mocked as a teenage-girl ritual. It is, functionally, a security protocol - and the reason it works is that <b>almost nobody does this in front of a witness who will remember.</b>" };
MAYA.m_upstairs_go={ who:null,
 text:["*Upstairs is quieter. The music drops to a thud in the floor. He opens a door onto a bedroom that is somebody's parents' bedroom.*",
       "*He closes it behind you. You hear the handle.*"],
 choices:[
  {t:"\"Open the door.\"",to:'m_up_door'},
  {t:"Laugh it off. Do not make it a thing.",to:'m_up_end',fx:{toll:2}},
  {t:"Text Priya. Now.",if:'told_priya',to:'m_up_text',fx:{support:1}}]};
MAYA.m_up_door={ who:'Jordan Vale', text:["Why are you being like this? I have been nice to you all day.",
  "*He is between you and the handle. He is not shouting. He does not need to.*"],
 choices:[{t:"Get past him. Out. Now.",to:'m_up_out'},{t:"Freeze.",to:'m_up_end'}]};
MAYA.m_up_text={ who:null, fx:{flag:'sent_location'},
 text:["*You type four letters and hit send and forty seconds later Priya is hammering on the door saying your name.*",
       "*He opens it. Of course he opens it. He is smiling by the time it swings.*"],
 to:'m_up_out' };
MAYA.m_up_out={ who:null, fx:{flag:'got_out',composure:1},
 text:"*You get out. You sit on the back step for a while and your hands do not stop for ten minutes.*",
 to:'m_party_leave' };
MAYA.m_up_end={ who:null, text:["*The music is very loud downstairs.*"], end:'upstairs' };

MAYA.m_stairs={ who:null, text:"*Stairs up to the rest of the house. It is dark up there.*" };

MAYA.m_party_leave={ who:null, fx:{time:90},
 text:["*Half past nine. You want to be home.*"],
 choices:[
  {t:"Walk. It is nine blocks.",to:'m_leave_walk'},
  {t:"Let Jordan drive you.",not:'got_out',to:'m_leave_jordan'},
  {t:"Call your mum, even though she is asleep.",if:'told_mom',to:'m_leave_mum'},
  {t:"Leave with Priya.",if:'party_with_priya',to:'m_leave_priya'}]};
MAYA.m_leave_priya={ who:null, fx:{flag:'safe_evening'},
 text:"*You walk out together, arms linked, doing the thing where you both talk very fast about nothing until you are past the dark stretch.*",
 to:'m_resolve' };
MAYA.m_leave_mum={ who:'Mom', fx:{flag:'safe_evening'},
 text:["*She picks up on the second ring, at half nine, after a twelve-hour shift.*","Where are you. Stay inside the house. Do not stand out front. I am seven minutes away.",
       "*She does not ask a single question in the car. She asks them tomorrow.*"],
 to:'m_resolve',
 teach:"The most protective thing an adult can do is be <b>boring and available</b> - reachable at 9:30 at night, and reliably not furious on arrival. Teens make risk calculations around what will happen when they call. Every parent controls that variable." };
MAYA.m_leave_jordan={ who:null, fx:{exposure:5},
 text:["*He has had three drinks and he says he has had one, and it is dark now, and it is nine blocks.*",
       "*You get in.*"],
 choices:[{t:"Get in.",to:'m_ride_end'},{t:"Actually - no. Get out.",to:'m_leave_walk',fx:{composure:2}}]};
MAYA.m_leave_walk={ who:null, text:"*You start walking. Nine blocks. You know every one of them.*",
 go:{room:'night_street',spawn:[60,220]} };

/* ---------- CH5 : the walk home ---------- */
MAYA.m_night1={ chapter:'Chapter Five - 9:40 PM', who:null, fx:{toll:1},
 text:["*Cordell Ave. Streetlights every other pole; the council has been meaning to fix that since March.*",
       "*Keys between the fingers. Earbuds out - you never actually play music, you just wear them so people think you cannot hear.*",
       "*Walk east toward your building.*"],
 teach:"Count what she is already doing before anything has happened: route chosen, hands occupied, hearing kept clear, phone charged, arrival time reported. <b>That is the invisible labour meter.</b> It runs whether or not the night goes badly." };

MAYA.m_follow_talk={ who:null,
 text:["*You have heard him for two blocks. When you slowed, he slowed. When you crossed, he crossed.*",
       "*He is about thirty feet back now.*"],
 choices:[
  {t:"Go into the corner store. Bright, staffed, camera.",to:'m_fol_store',fx:{composure:1,exposure:-3}},
  {t:"Call your mum and say her name loudly.",if:'told_mom',to:'m_fol_call',fx:{exposure:-2,support:1}},
  {t:"Call anyone. Fake a call if you have to.",to:'m_fol_fake',fx:{exposure:-1,toll:2}},
  {t:"Walk faster. Get to your door.",to:'m_fol_door',fx:{exposure:3}},
  {t:"Turn around and confront him.",to:'m_fol_face',fx:{exposure:2}}]};
MAYA.m_fol_store={ who:null, fx:{flag:'went_public'},
 text:["*You go in. You buy a drink you do not want and stand near the counter and text Priya.*",
       "*He walks past the window twice. The man behind the counter watches him do it, then says, without being asked: 'You want me to walk you out, or you want to wait? Either is fine.'*",
       "*You wait. Twenty minutes. He is gone.*"],
 to:'m_home_door',
 teach:"<b>Never lead a follower to your door.</b> Going somewhere bright and staffed is the highest-value move on the list: it adds witnesses, cameras, and an exit, and it costs only time. Waiting twenty minutes feels enormous and is nothing." };
MAYA.m_fol_call={ who:'Mom', fx:{flag:'went_public'},
 text:["*She answers. You say, loudly, 'Mum, I am on Cordell by the laundromat, someone is behind me' - and you say it for two audiences.*",
       "Stay on the phone. Stay on the phone with me. Walk to the store, not the flat. I am coming out the door now.",
       "*The footsteps stop. Then they go the other way.*"],
 to:'m_home_door' };
MAYA.m_fol_fake={ who:null,
 text:["*You call your own voicemail and have a conversation with it. 'Yeah, I am literally right here, are you outside?'*",
       "*It is a performance for a man who might be nobody, and you will feel ridiculous later, and you do it perfectly because you have practised it.*"],
 to:'m_home_door' };
MAYA.m_fol_face={ who:null,
 text:["*You turn around. You make yourself as loud and as visible as you can: 'WHY ARE YOU FOLLOWING ME.'*",
       "*Lights come on in a window above the launderette. He stops dead, says 'the hell is wrong with you', and turns down Beaumont.*",
       "*It worked. It also could have gone the other way, and there was no way to know which from where you were standing.*"],
 fx:{composure:1,flag:'went_public'}, to:'m_home_door',
 teach:"This is genuinely effective - noise, light and witnesses are what followers are avoiding. It is also the option with the widest range of outcomes, and <b>she had no way to tell which man she had.</b> The game will not tell you this was the wrong choice. It was not. It was a coin flip she was forced to hold." };
MAYA.m_fol_door={ who:null, fx:{exposure:3},
 text:["*You walk faster. He walks faster. You get your key out at the door of your own building, which means for four seconds your back is to the street and your hands are full.*"],
 choices:[
  {t:"Get inside. Slam it.",to:'m_fol_door2'},
  {t:"Turn around first.",to:'m_fol_face'}]};
MAYA.m_fol_door2={ who:null,
 text:["*The door needs a shove. It always needs a shove.*"],
 end:'followed' };

MAYA.m_home_door={ who:null,
 text:["*Your building. Third floor. The hall light is out again.*",
       "*You get inside and lock it and stand with your back against it for a second, the way you always do.*"],
 to:'m_resolve' };

DIANE.d_cher_rick={ who:'Cheryl',
 text:["*Now she looks up. A long, flat, evaluating look.*",

 /* ---- MAYA : bad ---- */
 ride:{ who:'maya',tag:'bad',title:'THE RIDE HOME',
  text:["The car goes past the turning for Cordell, and then past the ring road, and then the streetlights stop.",
        "Maya is reported missing at 6:15 the following morning, when her mother comes off shift.",
        "The last confirmed sighting is a school gate camera at 3:31 PM: a sixteen-year-old girl getting into a red Civic, of her own accord, smiling, because a boy she knew held the door open for her."],
  why:["Jordan was not a stranger. Around <b>8 in 10</b> people who assault or abduct a young person are known to them - a classmate, a friend's brother, a coach, a neighbour. 'Stranger danger' aims a child's whole threat model in the wrong direction.",
       "Every step was individually reasonable. A lift from a boy at school at half three in the afternoon is not a red flag. That is precisely why it works.",

 upstairs:{ who:'maya',tag:'bad',title:'TWO MINUTES UPSTAIRS',
  text:["The music was very loud downstairs. It was loud for a long time.",

 followed:{ who:'maya',tag:'bad',title:'THE DOOR',
  text:["The door needs a shove. It always needs a shove. For four seconds her back is to the street and both hands are full.",

 groom:{ who:'maya',tag:'bad',title:'THE FAVOURITE',
  text:["The messages carry on. There are four hundred of them by half term.",
        "By December, Maya has stopped sitting with Priya at lunch, because Mr. Halberd has explained, gently and repeatedly, that Priya is jealous of her, and that nobody else understands what they have.",

  why:["Grooming is a sequence, and every individual step is deniable: attention, flattery about maturity, a shared secret, a private channel, and then <b>the slow removal of everyone who might notice.</b>",
       "The secret is the load-bearing part. An adult asking a child to keep a relationship secret from other adults is the clearest single warning sign that exists.",
       "Isolating her from Priya was not a side effect. It was the point. Groomers do not fear the child - they fear the child's friends."],

 disbelieved:{ who:'maya',tag:'bad',title:'JUST A RUMOUR',
  text:["Ms. Alvarez listens for eleven minutes and takes notes on a yellow pad, and she believes her, personally, in the way that changes nothing.",
        "Mr. Halberd is 'spoken to'. He is back in room 214 on Thursday. He does not look at Maya once for the rest of the year, and he does not have to - by then, everyone knows there was a thing with Maya Okafor and a teacher, and the sentence has already rearranged itself into the shape people prefer.",

 smaller:{ who:'maya',tag:'bad',title:'SMALLER',
  text:["Nothing happened today.",

 nothing_m:{ who:'maya',tag:'ok',title:'NOTHING HAPPENED',

 receipts:{ who:'maya',tag:'ok',title:'RECEIPTS',
  text:["Maya and her mother are in the office at 8:05 AM, before the first bell, with fourteen printed screenshots and a timeline written on lined paper.",

 notalone:{ who:'maya',tag:'ok',title:'NOT JUST ME',

 nightcap:{ who:'diane',tag:'bad',title:'THE MERIDIAN',
  text:["The lift doors close on the fourth floor.",

 difficult:{ who:'diane',tag:'bad',title:'DIFFICULT',

 papertrail:{ who:'diane',tag:'ok',title:'THE PAPER TRAIL',

MAYA_ROOMS.night_street.update=function(dt){
  const r=MAYA_ROOMS.night_street, f=r.npcs[0];
  if(f.gone) return;
  if(F('went_public')||F('follow_done')){ f.gone=true; return; }
  if(!F('follow_started') && S.px>240){ setF('follow_started'); f.x=S.px-200; }
  if(F('follow_started') && !F('follow_talked')){
    const target=S.px-150, d=target-f.x;
    f.x += clamp(d,-150*dt,150*dt);
    if(S.px>430 && ((S.px-f.x)<175 || S.px>700)){ setF('follow_talked'); startNode('m_follow_talk'); }
  }
};

/* text pages may be functions (evaluated at display time) */
function resolvePages(t){
  if(typeof t==='function') t=t();
  const arr=Array.isArray(t)?t:[t];
  return arr.map(p=>typeof p==='function'?p():p);
}

/* NPC 'gone' flags must reset between runs */
function deepReset(rooms){
  for(const k in rooms){
    for(const n of rooms[k].npcs){ if(n.id!=='follower') n.gone=false; else n.gone=false, n.x=-200; }
    for(const e of rooms[k].exits) e._fired=false;
  }
  if(rooms.night_street) rooms.night_street.npcs[0].x=-200;
  return rooms;
}

/* ================================================================

   ================================================================ */
let last=performance.now(), T=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  X.setTransform(1,0,0,1,0,0);
  X.fillStyle='#07070a'; X.fillRect(0,0,CV.width,CV.height);
  if(S.mode!=='screen'&&S.room){
    X.save(); X.translate(ox,oy); X.scale(scale,scale);
    X.beginPath(); X.rect(0,0,VW,VH); X.clip();
    S.look=playerLook();
    if(S.mode==='play'&&S.fadeDir===0){ movePlayer(dt); const r=room(); if(r.update) r.update(dt); }
    else { S.moving=false; }
    if(S.room) drawRoom(T);
    X.restore();
    drawHUD();
  }
  drawFade(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

Object.assign(ENDINGS,{

 screenshot:{ who:'maya',tag:'bad',title:'THE SCREENSHOT',
  text:["It is fine for six days. On the seventh, Jordan and a girl he has started seeing have an argument, and he shows her his phone to prove something unrelated.",
        "By first break it is in three group chats. By lunch a boy Maya has never spoken to says her name in a corridor and four people laugh. By Thursday it has reached a Year 9 she used to babysit.",
        "Maya is called into an office. The conversation is about her decision-making. There is a phrase used about being careful what you put online, and a form about the school's e-safety policy, and at no point in forty minutes does anyone in the room say the words 'this was a criminal offence committed against you'.",
        "Jordan is spoken to. Jordan sits his exams. Maya finishes the year on a reduced timetable."],
  why:["<b>She did not commit an offence. He did.</b> Sending an image of yourself is not the crime; distributing someone else's without consent is - and where the subject is under 18, sharing it is a serious child protection offence regardless of who took it or who agreed to what.",
       "Note who the school investigated. This is the single most common institutional failure in these cases: the girl's judgement gets examined and the boy's <b>distribution</b> gets called a mistake.",
       "The coercion happened before any image existed - 'everyone does it', 'you're acting like a kid', and then the threat to say she had anyway. By the time she sent it, the pressure had been running for an hour."],
  fix:["The request is evidence. Screenshot it before you block, every time.",
       "If an image of you is being shared and you are under 18: <b>StopNCII.org</b> (18+) and <b>NCMEC's Take It Down</b> (takeitdown.ncmec.org, for minors) generate a digital fingerprint and get it removed across participating platforms. You never have to send the image itself to anyone.",
       "Report to the platform as a minor - takedown is legally required and usually fast.",
       "If you are a teacher or parent handling this: the first sentence must be that she is not in trouble. If she thinks she is the one being investigated, she will delete the evidence."] },

 account:{ who:'maya',tag:'bad',title:'THE ACCOUNT',
  text:["The demands do not stop, because they were never going to stop. Complying resets the clock; it does not end it. Ten minutes becomes five, becomes two, becomes a video, becomes money she does not have.",
        "He was not a seventeen-year-old at Ridgeway. There was no Ridgeway. There were somewhere between forty and four hundred other accounts running the same three weeks of conversation with other people's daughters, from a room a very long way away, as a job.",
        "Maya stops going to school on the 14th. She tells nobody for five weeks. The thing she says afterwards, the thing almost every young person in this situation says, is: 'I thought I would be in trouble.'"],
  why:["<b>Complying is the one thing that never works.</b> It is the single most important fact about sextortion and almost nobody is told it in advance: sending more does not buy safety, it establishes that threats work.",
       "The three weeks of ordinary, kind, attentive conversation were not a preamble to the crime. They <b>were</b> the crime, being carefully constructed. He remembered things she mentioned once because that was his job.",
       "This is now an industrial operation, not a lone predator, and it runs on one thing: the near-certainty that the target is too ashamed to tell an adult in the first hour, which is the only hour that really matters."],
  fix:["<b>Stop replying. Do not pay. Do not send more.</b> Screenshot everything, then block.",
       "Tell an adult immediately - the shame is the weapon, and it stops working the second another person knows.",
       "Report: NCMEC CyberTipline (report.cybertip.org) or 1-800-843-5678; in the UK, the IWF and CEOP (ceop.police.uk). Take It Down (takeitdown.ncmec.org) for removal.",
       "To every adult reading this: say out loud, to the young people in your life, before anything happens - <b>'if this ever happens, you will not be in trouble, and I will not take your phone away.'</b> That one sentence is the intervention."] },

 takedown:{ who:'maya',tag:'ok',title:'TAKE IT DOWN',
  text:["The kitchen light is on at one in the morning and Maya's mother is making a list on the back of an envelope, because that is what she does under pressure.",
        "Screenshots, saved and backed up. The account reported to the platform and to the CyberTipline. A hash submitted through Take It Down so that if anything ever surfaces, it comes down automatically, on every participating service, without Maya ever having to send it to a single human being.",
        "It is not clean. Maya cries twice and at one point says she is sorry, and her mother says 'do not you dare' in a voice Maya has never heard before.",
        "In the morning her mother rings the school - not to report Maya, but to tell them what to do if anything appears. Nothing ever does."],
  why:["She stopped replying mid-thread. That is the hardest single action in this entire game and it is the one that ends it - <b>the threat only has power while the conversation is live.</b>",
       "She told an adult inside the first hour, which is the window where everything is still recoverable and the shame has not yet had time to set.",
       "And the adult got it right: 'you are not in trouble' came before anything else. That sentence is the difference between this ending and the previous one, and it is entirely within the adult's control."],
  fix:["Stop replying. Screenshot. Block. Tell someone. In that order.",
       "takeitdown.ncmec.org (under 18) and StopNCII.org (18+) - both work from a hash, so the image never leaves your device.",
       "Report to the platform, and to the CyberTipline (1-800-843-5678 / report.cybertip.org) or CEOP in the UK.",
       "Nothing about this required Maya to have been more careful three weeks ago. It required one adult to be safe to wake up."] },

 spiked:{ who:'diane',tag:'bad',title:'THE GLASS',
  text:["She sits down for a minute. The minute is the last thing she has in order.",
        "There are perhaps ninety seconds of the taxi. There is a corridor that might be a hotel corridor. There is nothing else, and the nothing is not a gap in her memory that might fill in later - the drug prevented the memory from forming at all.",
        "She wakes at 6:40 with her phone at 4%, her shoes on, and about eleven hours she cannot account for.",
        "The common drugs are out of blood within around twelve hours and urine in under seventy-two. She spends most of those seventy-two hours trying to decide whether she is allowed to make a fuss, and by the time she decides, there is nothing left to test for."],
  why:["<b>The gap is not proof that nothing happened and it is not her being drunk.</b> Anterograde amnesia is what these compounds do; it is the reason they get used.",
       "It is used because it is nearly unprovable, and it is nearly unprovable because of exactly the hesitation she spent three days in. The delay is not incidental to the crime - it is engineered by it.",
       "She noticed within ninety seconds. Her instinct was completely accurate and she talked herself out of it, because the social cost of being wrong in front of colleagues felt more real than the risk of being right."],
  fix:["If the drink does not match the feeling, <b>say it out loud immediately</b>, to a named person, and ask them to stay with you. Do not wait for certainty - certainty is the thing being taken away.",
       "Get to A&E and ask specifically for a drug-facilitated assault screen. Same-day matters: hours, not days.",
       "In the UK a Sexual Assault Referral Centre (SARC) will take forensic samples and store them <b>without any obligation to report to police</b> - you can decide later. In the US, RAINN (1-800-656-4673) will find the nearest equivalent.",
       "If a colleague says the room feels wrong: believe them in the first second, stay physically with them, and get them out. Do not ask how much they have had."] },

 stalked:{ who:'diane',tag:'bad',title:'HE KNOWS WHERE YOU LIVE',
  text:["It is not one night. It is the following Tuesday, and the Tuesday after, and a car she starts recognising, and an unfamiliar number, and flowers at reception with no card that everyone at work finds charming.",
        "None of it is illegal on its own. That is the design. Each individual item is small enough to sound hysterical when described out loud, which is why she stops describing it out loud.",
        "She moves flat in the spring at her own expense. She does not report it, because there is nothing to report except a feeling and nineteen years of his good name, and because the only written record of any of it is in her own head.",
        "Rick Dunmore is promoted to Managing Director in the same quarter."],
  why:["Stalking is a <b>course of conduct</b> offence precisely because no single act meets the bar. Which means the entire case lives or dies on a contemporaneous log, and she does not have one.",
       "He obtained her address, and no one ever asked how. The unanswered question at the start of a pattern is nearly always the most important thing in it.",
       "Going down to the door was not the mistake people will say it was. The mistake was structural: she was alone with it, with no record, against a man the organisation had spent nineteen years deciding was harmless."],
  fix:["<b>Log every single incident</b> - date, time, what happened, witnesses, photos. Boring, dated, contemporaneous. It is the whole case.",
       "Report each one and get a reference number, even when it feels trivial. Reference numbers are what turn separate incidents into a pattern.",
       "Tell your neighbours, your building manager, and someone at work. Isolation is the operating requirement for all of this.",
       "UK: National Stalking Helpline 0808 802 0300. US: SPARC (stalkingawareness.org) and the National DV Hotline 1-800-799-7233.",
       "If a colleague mentions something like this once, in passing, treat it as the fifth time. It usually is."] }
