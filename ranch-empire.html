function drawAnimal(a){
  const b=brOf(a), S=SPECIES[a.sp];
  const grown=ageRatio(a), sc=(.55+.45*grown)*(S.sz/16);
  const x=a.x,y=a.y;
  shadow(x,y+7*sc,10*sc,4.5*sc);
  const f=a.flip?-1:1;
  X.save(); X.translate(x,y); X.scale(f*sc,sc);
  // legs
  X.fillStyle='#4a3a2a';
  if(a.sp==='cow'||a.sp==='horse'||a.sp==='pig'||a.sp==='sheep'){
    X.fillRect(-9,2,3,8); X.fillRect(-3,2,3,8); X.fillRect(4,2,3,8); X.fillRect(9,2,3,8);
  }else{ X.fillStyle='#c9922e'; X.fillRect(-3,3,2,6); X.fillRect(2,3,2,6); }
  // body
  X.fillStyle=b.c1;
  if(a.sp==='sheep'){
    for(const p of [[-7,-3],[0,-6],[7,-3],[0,0],[-5,2],[5,2]]){ X.beginPath(); X.arc(p[0],p[1],6,0,7); X.fill(); }
  }else{
    X.beginPath(); X.ellipse(0,-2,12,7,0,0,7); X.fill();
  }
  // markings
  X.fillStyle=b.c2;
  if(a.sp==='cow'){ X.beginPath(); X.ellipse(-4,-4,4,3,0,0,7); X.fill(); X.beginPath(); X.ellipse(5,0,3.5,2.5,0,0,7); X.fill(); }
  if(a.sp==='pig'){ X.beginPath(); X.ellipse(3,-4,3,2,0,0,7); X.fill(); }
  if(a.sp==='horse'){ X.fillRect(-2,-10,3,8); }
  // head
  X.fillStyle=a.sp==='sheep'?b.c2:b.c1;
  X.beginPath(); X.arc(12,-4,a.sp==='chicken'||a.sp==='duck'?4:5.5,0,7); X.fill();
  if(a.sp==='cow'||a.sp==='sheep'||a.sp==='horse'){ X.fillStyle='#e8e0d0'; X.fillRect(15,-9,2,4); X.fillRect(10,-10,2,4); }
  if(a.sp==='pig'){ X.fillStyle='#e8a898'; X.beginPath(); X.arc(16,-3,2.4,0,7); X.fill(); }
  if(a.sp==='chicken'||a.sp==='duck'){
    X.fillStyle=a.sp==='duck'?'#e8a92e':'#e0a030'; X.beginPath(); X.moveTo(15,-4); X.lineTo(21,-3); X.lineTo(15,-1); X.fill();
    if(a.sp==='chicken'){ X.fillStyle='#d84a3a'; X.fillRect(11,-10,4,3); }
  }
  X.fillStyle='#1a1a1a'; X.beginPath(); X.arc(13.5,-5,1,0,7); X.fill();
  X.restore();
  // ready indicator
  if(a.prod>=1){
    const t=Math.sin(performance.now()/300)*2;
    const res=SPECIES[a.sp].res;
    X.fillStyle='rgba(0,0,0,.45)'; X.beginPath(); X.arc(x,y-20*sc+t,8,0,7); X.fill();
    X.fillStyle=RES[res].col; X.beginPath(); X.arc(x,y-20*sc+t,5,0,7); X.fill();
  }
  if(a.full<25){
    X.fillStyle='#e07a5a'; X.font='bold 12px Verdana'; X.textAlign='center';
    X.fillText('!',x,y-24*sc);
  }
}
function drawPerson(n){
  const dead=n.dead>0;
  X.save();
  if(dead){ X.globalAlpha=Math.min(1,n.dead/6*1.4); X.translate(n.x,n.y); X.rotate(1.4); X.translate(-n.x,-n.y); }
  shadow(n.x,n.y+9,9,4);
  X.fillStyle=n.hitT>0?'#ffd0c0':n.col;
  roundRect(n.x-7,n.y-9,14,19,4); X.fill();
  X.fillStyle='#d9b48c'; X.beginPath(); X.arc(n.x,n.y-13,6,0,7); X.fill();
  if(n.type==='cop'){ X.fillStyle='#22345c'; X.fillRect(n.x-7,n.y-19,14,5); X.fillStyle='#e8c85a'; X.fillRect(n.x-3,n.y-4,6,4); }
  if(n.type==='rival'){ X.fillStyle='#3a2a1c'; X.fillRect(n.x-9,n.y-19,18,4); X.fillStyle='#3a2a1c'; X.beginPath(); X.arc(n.x,n.y-17,5,0,7); X.fill(); }
  if(!dead&&n.weapon&&n.aggro){
    X.strokeStyle='#d8d8d8'; X.lineWidth=3; X.beginPath();
    X.moveTo(n.x,n.y); X.lineTo(n.x+Math.cos(n.face)*16,n.y+Math.sin(n.face)*16); X.stroke();
  }
  X.restore();
  if(!dead){
    if(n.hp<n.max){
      X.fillStyle='rgba(0,0,0,.6)'; X.fillRect(n.x-15,n.y-26,30,4);
      X.fillStyle=n.aggro?'#d85a44':'#7ac05a'; X.fillRect(n.x-15,n.y-26,30*clamp(n.hp/n.max,0,1),4);
    }
    if(n.type==='rival'||n.aggro){
      X.fillStyle=n.aggro?'#ffb0a0':'#e8dfc0'; X.font='bold 10px Verdana'; X.textAlign='center';
      X.fillText(n.name,n.x,n.y-30);
    }
  }
  n.hitT=Math.max(0,(n.hitT||0)-.02);
}
function drawPlayer(){
  if(P.dead>0){
    X.save(); X.globalAlpha=.6; X.translate(P.x,P.y); X.rotate(1.4);
    X.fillStyle='#c8b48c'; roundRect(-7,-9,14,19,4); X.fill(); X.restore(); return;
  }
  shadow(P.x,P.y+9,10,4.5);
  const bob=Math.sin(P.anim)*1.5;
  X.fillStyle='#3f5f7a'; roundRect(P.x-8,P.y-9+bob,16,19,4); X.fill();
  X.fillStyle='#d9b48c'; X.beginPath(); X.arc(P.x,P.y-13+bob,6.5,0,7); X.fill();
  X.fillStyle='#6b4a30'; X.beginPath(); X.ellipse(P.x,P.y-17+bob,11,4.5,0,0,7); X.fill();
  X.beginPath(); X.arc(P.x,P.y-18+bob,6,0,7); X.fill();
  // weapon
  const w=WEAPONS[G.weapon];
  if(G.weapon!=='fists'&&!G.holster){
    const a=P.face, ex=P.x+Math.cos(a), ey=P.y+Math.sin(a)+bob;
    const len=w.kind==='gun'?(G.weapon==='shotgun'?22:15):(G.weapon==='bat'?20:12);
    const sw=P.swing>0?.8:0;
    X.strokeStyle=w.kind==='gun'?'#3a3a3a':(G.weapon==='bat'?'#9a7040':'#d8d8d8');
    X.lineWidth=w.kind==='gun'?5:(G.weapon==='bat'?6:3);
    X.beginPath(); X.moveTo(ex+Math.cos(a+sw)*7,ey+Math.sin(a+sw)*7);
    X.lineTo(ex+Math.cos(a+sw)*(7+len),ey+Math.sin(a+sw)*(7+len)); X.stroke();
    if(P.swing>0&&w.kind==='gun'){
      X.fillStyle='rgba(255,220,120,.9)';
      X.beginPath(); X.arc(ex+Math.cos(a)*(9+len),ey+Math.sin(a)*(9+len),6,0,7); X.fill();
    }
  }
  if(P.swing>0&&WEAPONS[G.weapon].kind!=='gun'){
    X.strokeStyle='rgba(255,255,255,.45)'; X.lineWidth=3;
    X.beginPath(); X.arc(P.x,P.y,WEAPONS[G.weapon].reach,P.face-.9,P.face+.9); X.stroke();
  }
}
function updateFx(dt){
  for(let i=G.fx.length-1;i>=0;i--){ const f=G.fx[i]; f.t+=dt; f.y-=22*dt; if(f.t>1.2) G.fx.splice(i,1); }
}
function draw(){
  X.clearRect(0,0,VW,VH);
  drawGround();
  X.save(); X.translate(-G.cam.x,-G.cam.y);
  if(G.map==='farm'){
    for(const s of G.structs) drawStruct(s);
    drawCar(CARSPOT.farm.x,CARSPOT.farm.y);
  } else drawCar(CARSPOT.town.x,CARSPOT.town.y);
  // build ghost
  const g=buildGhost();
  if(g){
    X.globalAlpha=.55; X.fillStyle=g.ok?'#7ac05a':'#d85a44'; X.fillRect(g.x,g.y,g.w,g.h);
    X.globalAlpha=1; X.strokeStyle=g.ok?'#bfe08a':'#ff9a88'; X.lineWidth=2; X.strokeRect(g.x,g.y,g.w,g.h);
  }
  const ents=[];
  if(G.map==='farm') for(const a of G.animals) ents.push({y:a.y,f:()=>drawAnimal(a)});
  else for(const n of G.npcs) ents.push({y:n.y,f:()=>drawPerson(n)});
  ents.push({y:P.y,f:drawPlayer});
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents) e.f();
  for(const b of G.bullets){
    X.fillStyle=b.col; X.beginPath(); X.arc(b.x,b.y,2.6,0,7); X.fill();
    X.strokeStyle='rgba(255,230,160,.35)'; X.lineWidth=2;
    X.beginPath(); X.moveTo(b.x,b.y); X.lineTo(b.x-b.vx*.02,b.y-b.vy*.02); X.stroke();
  }
  for(const f of G.fx){
    X.globalAlpha=clamp(1.2-f.t,0,1); X.fillStyle=f.col;
    X.font='bold 13px Verdana'; X.textAlign='center'; X.fillText(f.text,f.x,f.y);
  }
  X.globalAlpha=1;
  X.restore();
  const na=nightAlpha();
  if(na>0){ X.fillStyle='rgba(18,24,48,'+na+')'; X.fillRect(0,0,VW,VH); }
  if(G.wanted>0){
    const p=(Math.sin(performance.now()/180)+1)/2;
    X.strokeStyle='rgba(220,60,50,'+(.25+p*.35)+')'; X.lineWidth=10; X.strokeRect(0,0,VW,VH);
  }
  if(P.dead>0){ X.fillStyle='rgba(60,0,0,.45)'; X.fillRect(0,0,VW,VH);
    X.fillStyle='#ffd8c8'; X.font='bold 30px Verdana'; X.textAlign='center';
    X.fillText('YOU WENT DOWN',VW/2,VH/2); }
  drawMinimap();
}
function drawMinimap(){
  if(G.map!=='farm') return;
  const w=150,h=110,x=VW-w-10,y=10;
  X.fillStyle='rgba(10,14,10,.72)'; roundRect(x,y,w,h,6); X.fill();
  X.strokeStyle='#4a5a3a'; X.lineWidth=1; X.stroke();
  const sx=w/FARM_W, sy=h/FARM_H;
  const r=farmRect();
  X.fillStyle='rgba(120,160,80,.25)'; X.fillRect(x+r.x*sx,y+r.y*sy,r.w*sx,r.h*sy);
  for(const s of G.structs){ X.fillStyle=isPen(s)?'#9c7a48':'#7a8a96'; X.fillRect(x+s.x*sx,y+s.y*sy,Math.max(2,s.w*sx),Math.max(2,s.h*sy)); }
  X.fillStyle='#8a3a30'; X.fillRect(x+CARSPOT.farm.x*sx-2,y+CARSPOT.farm.y*sy-2,5,4);
  X.fillStyle='#ffe08a'; X.fillRect(x+P.x*sx-2,y+P.y*sy-2,4,4);
}

/* -------------------------------------------------------------------- HUD */
let hudT=0;
function hud(dt){
  hudT-=dt; if(hudT>0) return; hudT=.15;
  const feedLow=G.feed<dailyFeed()*1.5;
  $hud.innerHTML=
    '<div class="card">Day <b>'+G.day+'</b> &nbsp; '+timeStr()+'<br><s style="color:#8a9a78">'+(G.map==='farm'?esc(G.loc.name):'Town')+'</s></div>'+
    '<div class="card">Cash<br><b class="money" style="font-size:15px">'+money(G.cash)+'</b></div>'+
    '<div class="card">Reputation <b>'+Math.round(G.rep)+'</b> '+repWord()+'<br><span class="bar"><i style="width:'+Math.round(G.rep)+'%;background:linear-gradient(90deg,#b85,#cd6)"></i></span></div>'+
    '<div class="card">Feed <b'+(feedLow?' style="color:#e07a5a"':'')+'>'+Math.round(G.feed)+'</b>/'+feedCap()+
      '<br><s style="color:#8a9a78">herd eats '+dailyFeed().toFixed(1)+'/day</s></div>'+
    '<div class="card">Stock <b>'+G.animals.length+'</b> &nbsp; Meat <b>'+G.meats.length+'</b><br><s style="color:#8a9a78">produce '+Math.round(prodTotal())+'/'+prodCap()+'</s></div>'+
    (G.bank.balance>=1||G.bank.loan>=1?'<div class="card">Bank <b class="money">'+money(G.bank.balance)+'</b>'+
      (G.bank.loan>=1?'<br><s style="color:#e07a5a">debt '+money(G.bank.loan)+', '+Math.max(0,G.bank.due)+'d</s>':'<br><s style="color:#8a9a78">+'+money(G.bank.balance*G.bank.rate)+'/day</s>')+'</div>':'')+
    (G.wanted?'<div class="card" style="border-color:#a04030;color:#ffb0a0"><b>WANTED</b> '+'&#9733;'.repeat(G.wanted)+'<br><s>get to your car</s></div>':'');
  const w=WEAPONS[G.weapon];
  $bot.innerHTML='<div class="card">Health<br><span class="bar" style="width:150px"><i style="width:'+Math.round(P.hp/P.max*100)+'%;background:linear-gradient(90deg,#a33,#6c4)"></i></span> <b>'+Math.round(P.hp)+'</b></div>'+
    '<div class="card">'+(G.holster&&G.weapon!=='fists'?'<s style="color:#8a9a78">stowed: </s>':'')+'<b>'+w.name+'</b>'+
    (w.ammo?' <s style="color:#8a9a78">'+G.ammo[w.ammo]+'</s>':'')+(w.illegal?' <span style="color:#e07a5a">illegal</span>':'')+
    '<br><s style="color:#8a9a78">'+WKEYS.filter(k=>G.owned[k]).map((k,i)=>(WKEYS.indexOf(k)+1)+':'+WEAPONS[k].name).join('  ')+'</s></div>';
  $hint.innerHTML=(G.map==='farm'
    ?'C collect &nbsp; B build &nbsp; G upgrade &nbsp; E use'
    :'E use &nbsp; F mug &nbsp; click attack')+'<br>Q stock &nbsp; R ledger &nbsp; H help &nbsp; X stow';
  // contextual prompt
  let p='';
  if(G.build) p='<b>Left click</b> to build here &nbsp;·&nbsp; <b>Shift</b> keep placing &nbsp;·&nbsp; <b>Esc</b> cancel';
  else if(nearCar()) p='<b>E</b> &mdash; drive to '+(G.map==='farm'?'town':'the farm');
  else{
    const b=nearBuilding();
    if(b) p='<b>E</b> &mdash; '+b.name;
    else{
      const n=nearestNpc(50,t=>!t.dead);
      if(n) p='<b>E</b> &mdash; talk to '+esc(n.name)+(n.type==='civ'?' &nbsp;·&nbsp; <b>F</b> &mdash; rob them':'');
      else{
        const a=nearAnimal(), st=nearStruct();
        if(a) p='<b>E</b> &mdash; '+esc(a.name)+' the '+brOf(a).name.toLowerCase()+
          (a.prod>=1?' &nbsp;·&nbsp; <b>C</b> collect':'')+(st?' &nbsp;·&nbsp; <b>G</b> &mdash; upgrade the '+STRUCTS[st.k].name.toLowerCase():'');
        else if(st) p='<b>E</b> or <b>G</b> &mdash; upgrade the '+STRUCTS[st.k].name.toLowerCase();
      }
    }
  }
  if(p){ $prompt.innerHTML=p; $prompt.classList.remove('hidden'); } else $prompt.classList.add('hidden');
  if(G.cheatOpen) renderCheat();
}

/* ----------------------------------------------------------- time & loop */
function stepWorld(dt){
  const mins=dt*(1440/G.dayLen);
  G.tmin+=mins;
  while(G.tmin>=1440){ G.tmin-=1440; newDay(); }
  updateAnimals(dt,dt/G.dayLen);
}
function newDay(){
  G.day++;
  rollPrices();
  for(const r of G.rivals) if(!r.dead) r.rel=clamp(r.rel+(r.partner?1:0)-.3,0,100);
  const notes=[];
  // what the hired hands / egg belts / milking rigs brought in overnight
  const auto=Object.keys(G.autoDay||{}).filter(k=>G.autoDay[k]>=1);
  if(auto.length) notes.push('Your hands brought in '+auto.map(k=>Math.floor(G.autoDay[k])+' '+RES[k].name).join(', ')+'.');
  G.autoDay={};
  // stocked pond
  let fish=0; for(const s of G.structs) if(s.k==='pond') fish+=55*ulvl(s,'fish');
  if(fish){ G.cash+=fish; notes.push('The pond sold '+money(fish)+' of fish.'); }
  // standing feed order
  const silo=G.structs.find(s=>s.k==='silo'&&ulvl(s,'order'));
  if(silo&&G.feed<feedCap()*.35){
    const price=feedPrice()*1.1;
    const n=Math.min(Math.floor(feedCap()-G.feed),Math.floor(G.cash/price));
    if(n>0){ G.cash-=n*price; G.feed+=n; notes.push('Feed order delivered '+n+' units for '+money(n*price)+'.'); }
    else notes.push('<span class="warn">Your standing feed order bounced &mdash; no cash.</span>');
  }
  // standing produce order
  if(G.structs.some(s=>s.k==='shed'&&ulvl(s,'order'))){
    let tot=0;
    for(const k in G.prods){ const q=Math.floor(G.prods[k]); if(q>0){ tot+=q*RES[k].base*(G.priceMult[k]||1)*.92; G.prods[k]-=q; } }
    if(tot>0){ G.cash+=tot; G.stats.earned+=tot; notes.push('The produce truck paid '+money(tot)+'.'); }
  }
  // standing cull order: only ever thins pens that are already full, never young stock
  const abat=G.structs.find(s=>s.k==='abat'&&ulvl(s,'cull')&&togOn(s,'cull'));
  if(abat){
    let culled=0;
    for(const pen of G.structs){
      if(!isPen(pen)||penAnimals(pen).length<penCap(pen)) continue;
      const grown=penAnimals(pen).filter(isAdult).sort((a,b)=>b.age-a.age);
      if(grown.length){ slaughter(grown[0],true); culled++; }
    }
    if(culled) notes.push('The cull order took '+culled+' head out of full pens.');
  }
  bankDay(notes);
  save();
  toast('<b>Day '+G.day+'.</b> '+pick(['The herd is stirring.','Frost on the fence posts.','Trucks are already rolling into town.','Quiet morning.','Feed prices moved overnight.']));
  for(const n of notes) toast(n);
}
function rollPrices(){
  G.priceMult={feed:rnd(.85,1.2)};
  for(const k in RES) G.priceMult[k]=rnd(.85,1.18);
}
function advanceTime(mins){
  const secs=mins/(1440/G.dayLen);
  let left=secs;
  while(left>0){ const step=Math.min(left,.4); stepWorld(step); left-=step; }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(G.scene==='play'){
    const open=!!G.ui;
    if(!open){ updatePlayer(dt); updateNpcs(dt); updateBullets(dt); }
    if(!open||G.ui.name==='market') stepWorld(dt);
    if(open&&G.ui.name==='market') updateMarket(dt);
    updateFx(dt);
    draw();
    hud(dt);
  }
  requestAnimationFrame(frame);
}

/* ============================================================ cheat menu */
const $cheat=EL('cheat'), $cheatTab=EL('cheatTab');
function toggleCheat(){
  G.cheatOpen=!G.cheatOpen;
  $cheatTab.classList.toggle('active',G.cheatOpen);
  $cheat.classList.toggle('hidden',!G.cheatOpen);
  if(G.cheatOpen) renderCheat();
}
function cbtn(label,fn,on){ return '<button class="'+(on?'on':'')+'" onclick="'+fn+'">'+label+'</button>'; }
function renderCheat(){
  if(!G.cheatOpen) return;
  const wStr=WKEYS.filter(k=>G.owned[k]).length+'/'+WKEYS.length+' weapons';
  $cheat.innerHTML=
    '<div class="stat2"><s>Cash</s><b>'+money(G.cash)+'</b></div>'+
    '<div class="stat2"><s>Reputation</s><b>'+Math.round(G.rep)+'</b></div>'+
    '<div class="stat2"><s>Wanted</s><b>'+G.wanted+'</b></div>'+
    '<div class="stat2"><s>Day</s><b>'+G.day+', '+timeStr()+'</b></div>'+

    '<h4>MONEY</h4><div class="row2">'+
    cbtn('+$1,000',"cheatCash(1000)")+cbtn('+$10,000',"cheatCash(10000)")+cbtn('+$100,000',"cheatCash(100000)")+
    '</div><div class="row2">'+cbtn('+$5,000 bank',"cheatBank(5000)")+cbtn('Clear loan',"cheatClearLoan()")+'</div>'+

    '<h4>REPUTATION</h4><div class="row2">'+
    cbtn('Max (100)',"cheatRep(100)")+cbtn('Good (75)',"cheatRep(75)")+cbtn('Zero (0)',"cheatRep(0)")+'</div>'+

    '<h4>FARM</h4><div class="row2">'+
    cbtn('Fill feed',"cheatFillFeed()")+cbtn('Fill storage',"cheatFillStorage()")+'</div>'+
    '<div class="row2">'+cbtn('Grow all animals up',"cheatGrowAll()")+cbtn('Heal &amp; feed all',"cheatHealAll()")+'</div>'+
    '<div class="row2">'+cbtn('Force births',"cheatForceBirths()")+cbtn('+1 Prime meat lot',"cheatAddMeat(95)")+'</div>'+
    '<div class="row2">'+cbtn('Own all land',"cheatAllLand()")+cbtn('Max every upgrade',"cheatMaxUpgrades()")+'</div>'+

    '<h4>PLAYER</h4><div class="row2">'+
    cbtn('Full health',"cheatFullHP()")+cbtn('All weapons + ammo',"cheatAllWeapons()")+'</div>'+
    '<div class="row2">'+cbtn('All tools',"cheatAllTools()")+'</div>'+
    '<div class="row2">'+cbtn('God mode: '+(G.godmode?'ON':'off'),"cheatToggleGod()",G.godmode)+'</div>'+
    '<div class="row2">'+cbtn('Cops ignore you: '+(G.noHeat?'ON':'off'),"cheatToggleHeat()",G.noHeat)+'</div>'+

    '<h4>CRIME</h4><div class="row2">'+
    cbtn('Clear wanted',"cheatClearWanted()")+cbtn('Max wanted',"cheatMaxWanted()")+'</div>'+

    '<h4>TIME</h4><div class="row2">'+
    cbtn('Skip to morning',"cheatSkipDay()")+cbtn('Skip 7 days',"cheatSkipDays(7)")+'</div>'+

    '<h4>SAVE</h4><div class="row2">'+
    cbtn('Save now',"save()")+cbtn('Wipe save',"wipe()")+'</div>';
}
function cheatCash(n){ G.cash+=n; toast('Cheat: +'+money(n),'good'); renderCheat(); save(); }
function cheatBank(n){ G.bank.balance+=n; toast('Cheat: +'+money(n)+' on deposit','good'); renderCheat(); }
function cheatClearLoan(){ G.bank.loan=0; G.bank.due=0; toast('Cheat: loan cleared','good'); renderCheat(); }
function cheatRep(n){ G.rep=n; toast('Cheat: reputation set to '+n,'good'); renderCheat(); }
function cheatFillFeed(){ G.feed=feedCap(); toast('Cheat: silo filled','good'); renderCheat(); }
function cheatFillStorage(){
  let left=prodCap()-prodTotal();
  const keys=Object.keys(RES);
  while(left>0.5){
    let any=false;
    for(const k of keys){ if(left<=0) break; const add=Math.min(30,left); G.prods[k]+=add; left-=add; any=true; }
    if(!any) break;
  }
  toast('Cheat: produce storage filled','good'); renderCheat();
}
function cheatGrowAll(){
  let n=0; for(const a of G.animals){ const g=brOf(a).grow; if(a.age<g){ a.age=g; n++; } }
  toast('Cheat: '+n+' animal(s) grown to maturity','good'); renderCheat();
}
function cheatHealAll(){
  for(const a of G.animals){ a.hp=100; a.full=100; }
  toast('Cheat: whole herd healed and fed','good'); renderCheat();
}
function cheatForceBirths(){
  let n=0;
  for(const a of G.animals){
    if(a.sex!=='F'||!isAdult(a)) continue;
    const pen=G.structs.find(s=>s.id===a.pen); if(!pen) continue;
    if(!penAnimals(pen).some(o=>o.sex==='M'&&isAdult(o))) continue;
    a.breedT=brOf(a).breed; n++;
  }
  toast('Cheat: '+n+' female(s) primed to give birth next tick','good'); renderCheat();
}
function cheatAddMeat(q){
  const sp=pick(SPKEYS), br=pick(Object.keys(SPECIES[sp].breeds));
  G.meats.push({id:uid(),sp,br,kg:rnd(20,80),q,q0:q,day:G.day,name:MEAT[sp].name+' ('+SPECIES[sp].breeds[br].name+')'});
  toast('Cheat: added a meat lot','good'); renderCheat();
}
function cheatAllLand(){ G.land=LAND.length-1; toast('Cheat: you now own '+LAND[G.land].name,'good'); renderCheat(); }
function cheatMaxUpgrades(){
  let n=0;
  for(const s of G.structs){ s.up=s.up||{}; for(const u of upgList(s)){ if(ulvl(s,u.id)<u.max){ s.up[u.id]=u.max; n++; } } }
  toast('Cheat: maxed '+n+' upgrade line(s)','good'); renderCheat();
}
function cheatFullHP(){ P.hp=P.max; toast('Cheat: full health','good'); renderCheat(); }
function cheatAllWeapons(){
  for(const k of WKEYS) G.owned[k]=true;
  G.ammo.pistol=999; G.ammo.shell=999;
  toast('Cheat: every weapon and full ammo','good'); renderCheat();
}
function cheatAllTools(){
  G.tools.bucket=true; G.tools.quad=true;
  if(!G.tools.vest){ G.tools.vest=true; P.max=150; P.hp=Math.min(P.max,P.hp+50); }
  toast('Cheat: every tool owned','good'); renderCheat();
}
function cheatToggleGod(){ G.godmode=!G.godmode; toast('Cheat: god mode '+(G.godmode?'ON':'off'),G.godmode?'good':'bad'); renderCheat(); }
function cheatToggleHeat(){ G.noHeat=!G.noHeat; toast('Cheat: cops '+(G.noHeat?'will ignore you':'back to normal'),G.noHeat?'good':'bad'); renderCheat(); }
function cheatClearWanted(){ G.wanted=0; G.chaseT=0; toast('Cheat: wanted cleared','good'); renderCheat(); }
function cheatMaxWanted(){ G.wanted=5; G.chaseT=0; toast('Cheat: wanted maxed','bad'); renderCheat(); }
function cheatSkipDay(){
  let mins=(7*60-G.tmin+1440)%1440; if(mins<30) mins+=1440;
  advanceTime(mins); toast('Cheat: skipped to morning','good'); renderCheat();
}
function cheatSkipDays(n){ advanceTime(1440*n); toast('Cheat: skipped '+n+' days','good'); renderCheat(); }

/* ------------------------------------------------------------ save / load */
const SKEY='ranchempire.v1';
function save(){
  if(G.scene!=='play') return;
  try{
    localStorage.setItem(SKEY,JSON.stringify({
      loc:G.loc.id,day:G.day,tmin:G.tmin,cash:G.cash,rep:G.rep,feed:G.feed,prods:G.prods,
      meats:G.meats,animals:G.animals,structs:G.structs,ammo:G.ammo,owned:G.owned,weapon:G.weapon,
      tools:G.tools,land:G.land,rivals:G.rivals,stats:G.stats,map:G.map,bank:G.bank,autoDay:G.autoDay,
      px:P.x,py:P.y,hp:P.hp,max:P.max,uid:UID,priceMult:G.priceMult
    }));
  }catch(e){}
}
function loadSave(){
  try{ const s=JSON.parse(localStorage.getItem(SKEY)); return s&&s.loc?s:null; }catch(e){ return null; }
}
function doLoad(){
  const s=loadSave(); if(!s) return;
  G.loc=LOCS.find(l=>l.id===s.loc)||LOCS[0]; G.mods=G.loc.mods;
  G.day=s.day; G.tmin=s.tmin; G.cash=s.cash; G.rep=s.rep; G.feed=s.feed;
  G.prods=Object.assign({milk:0,egg:0,wool:0,truffle:0,manure:0,duckegg:0},s.prods);
  G.meats=s.meats||[]; G.animals=s.animals||[]; G.structs=s.structs||[];
  for(const st of G.structs){ st.up=st.up||{}; st.tog=st.tog||{}; }
  G.bank=Object.assign({balance:0,rate:.018,sec:0,robbedDay:-99,loan:0,due:0,heist:false},s.bank||{});
  G.bank.heist=false;
  G.autoDay=s.autoDay||{};
  G.ammo=s.ammo||{pistol:0,shell:0}; G.owned=s.owned||{fists:true}; G.weapon=s.weapon||'fists';
  G.tools=s.tools||{}; G.land=s.land||0; G.stats=Object.assign(G.stats,s.stats||{});
  G.rivals=RIVALDEF.map(d=>{
    const f=(s.rivals||[]).find(r=>r.id===d.id)||{};
    return {id:d.id,name:d.name,col:d.col,likes:d.likes,rel:f.rel!==undefined?f.rel:30,
            partner:!!f.partner,dead:!!f.dead,talkT:0};
  });
  G.priceMult=s.priceMult||{}; if(!G.priceMult.feed) rollPrices();
  UID=Math.max(s.uid||1,1000);
  G.map=s.map||'farm'; P.x=s.px; P.y=s.py; P.hp=s.hp; P.max=s.max||100;
  G.holster=WEAPONS[G.weapon].illegal;
  G.scene='play';
  if(G.map==='town') spawnTown(); else G.npcs=[];
  G.cam.x=clamp(P.x-VW/2,0,Math.max(0,worldW()-VW));
  G.cam.y=clamp(P.y-VH/2,0,Math.max(0,worldH()-VH));
  $start.classList.add('hidden');
  toast('Loaded &mdash; day '+G.day+' at '+esc(G.loc.name)+'.','good');
}
function wipe(){
  if(!confirm('Abandon this farm and start over? Everything is lost.')) return;
  try{ localStorage.removeItem(SKEY); }catch(e){}
  location.reload();
}

/* ------------------------------------------------------------------- boot */
function boot(){
  initPatterns();
  rollPrices();
  buildStartScreen();
  const s=loadSave();
  if(s){
    const d=document.createElement('div');
    d.className='loc'; d.style.borderColor='#a5c273';
    d.style.width='100%'; d.style.maxWidth='1020px'; d.style.marginBottom='12px';
    d.innerHTML='<h3>&#9654; CONTINUE</h3><div class="d" style="min-height:0">'+
      esc((LOCS.find(l=>l.id===s.loc)||{}).name||'Your farm')+' &mdash; day '+s.day+
      ', '+money(s.cash)+', '+((s.animals||[]).length)+' head of stock.</div>';
    d.onclick=doLoad;
    $locs.parentNode.insertBefore(d,$locs);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
