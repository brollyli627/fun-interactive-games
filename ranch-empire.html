<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RANCH EMPIRE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0f0b;color:#e9e3d2;font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{display:block;position:absolute;inset:0}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;right:0;padding:8px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none;font-size:12.5px;z-index:5}
.card{background:rgba(12,16,11,.84);border:1px solid #3d4a33;border-radius:7px;padding:5px 9px;line-height:1.45;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.card b{color:#f3d98b}
.bar{width:110px;height:7px;background:#2a3123;border:1px solid #47533b;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
#bottomhud{position:absolute;left:8px;bottom:8px;display:flex;gap:8px;align-items:flex-end;pointer-events:none;font-size:12.5px;z-index:5}
#keyhint{position:absolute;right:8px;bottom:8px;font-size:11px;color:#8e9a7e;text-align:right;pointer-events:none;line-height:1.5;z-index:5}
#toasts{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column;gap:5px;align-items:center}
.toast{background:rgba(12,16,11,.92);border:1px solid #5c6b4b;border-left:3px solid #d8b44a;padding:6px 14px;border-radius:5px;font-size:13px;animation:tin .25s ease}
.toast.bad{border-left-color:#c8503a}.toast.good{border-left-color:#6fbf5a}.toast.cop{border-left-color:#4f8fd8}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#prompt{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(12,16,11,.9);border:1px solid #6d7b58;border-radius:6px;padding:6px 14px;font-size:13px;z-index:5;pointer-events:none;text-align:center}
#prompt b{color:#f3d98b}

/* ---------- Modal / panels ---------- */
#modal{position:absolute;inset:0;background:rgba(6,8,6,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{background:linear-gradient(#1a2016,#141a11);border:1px solid #55643f;border-radius:12px;width:min(980px,100%);max-height:calc(100vh - 36px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.7)}
.panel.sm{width:min(580px,100%)}
.ph{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #3c4830;background:rgba(0,0,0,.22);border-radius:12px 12px 0 0}
.ph h2{font-size:17px;letter-spacing:2px;color:#f3d98b;font-weight:700}
.ph .sub{font-size:12px;color:#94a382;flex:1}
.pb{padding:14px 16px;overflow:auto;flex:1}
.pf{padding:10px 16px;border-top:1px solid #3c4830;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:#9db089}
.x{margin-left:auto;background:#3a2420;border:1px solid #7a4436;color:#e8bfae;border-radius:6px;padding:4px 12px;font-size:12px}
.x:hover{background:#5a3128}

.btn{background:#2b3623;border:1px solid #5a6b45;color:#e4e9d6;border-radius:6px;padding:6px 12px;font-size:12.5px;transition:.12s}
.btn:hover{background:#3c4c30;border-color:#87a163}
.btn.on{background:#4c6136;border-color:#9dbd6d;color:#fff}
.btn.buy{background:#2c3a2a;border-color:#5f8a4c}.btn.buy:hover{background:#3d5439}
.btn.sell{background:#3a3324;border-color:#8a7a3f}.btn.sell:hover{background:#4e452f}
.btn.dang{background:#3a2320;border-color:#8a4436}.btn.dang:hover{background:#52302a}
.btn:disabled{opacity:.38;cursor:not-allowed;background:#242a20}
.btn.sm{padding:3px 8px;font-size:11.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
.item{background:rgba(255,255,255,.035);border:1px solid #3d4a30;border-radius:9px;padding:10px;display:flex;flex-direction:column}
.item h3{font-size:14px;color:#f0dfa8;margin-bottom:3px}
.item .d{font-size:11.5px;color:#93a381;min-height:32px;line-height:1.4;margin-bottom:6px}
.stat{display:flex;justify-content:space-between;font-size:11.5px;color:#c3cfb2;padding:1px 0}
.stat s{color:#8a9a78;text-decoration:none}
.row{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid #3a4630;border-radius:7px;background:rgba(255,255,255,.03);margin-bottom:7px;font-size:12.5px;flex-wrap:wrap}
.row.sel{border-color:#9dbd6d;background:rgba(120,160,80,.14)}
.spacer{flex:1}
.q{padding:1px 7px;border-radius:20px;font-size:11px;font-weight:bold}
.q1{background:#5d2a22;color:#ffbcaa}.q2{background:#5c4a1e;color:#ffe1a0}.q3{background:#2e5230;color:#b6f0ac}.q4{background:#245049;color:#9df0da}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.cols{grid-template-columns:1fr}}
.h4{font-size:12px;letter-spacing:1.6px;color:#8fa07c;margin-bottom:8px;border-bottom:1px solid #33402a;padding-bottom:4px}
.mood{font-size:11px;color:#9db089;font-style:italic}
.money{color:#8fd66a;font-weight:bold}
.warn{color:#e0a55a}.bad{color:#e07a5a}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#c3cfb2}
.chk i{width:14px;height:14px;border:1px solid #7d8f68;border-radius:3px;display:inline-block;background:#1a2016}
.chk.on i{background:#8fbf5a;box-shadow:inset 0 0 0 2px #1a2016}
.dlg{font-size:13px;line-height:1.6;color:#cfd8c0;background:rgba(0,0,0,.22);border-left:3px solid #6f8a4f;padding:9px 12px;border-radius:0 6px 6px 0;margin-bottom:12px}
.empty{color:#7f8d70;font-size:12.5px;font-style:italic;padding:14px 0;text-align:center}
.help b{color:#f0dfa8}
.help li{margin:3px 0 3px 16px;font-size:12.5px;line-height:1.55;color:#c3cfb2}

/* ---------- Start screen ---------- */
#start{position:absolute;inset:0;z-index:30;background:radial-gradient(circle at 50% 18%,#1d2717,#0a0d08 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
#start h1{font-size:min(58px,11vw);letter-spacing:9px;color:#f0cf72;text-shadow:0 4px 0 #3f3311,0 0 30px rgba(240,207,114,.25)}
#start .tag{color:#93a381;letter-spacing:3px;font-size:12px;margin:6px 0 22px}
#locs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));max-width:1020px;width:100%}
.loc{background:rgba(255,255,255,.04);border:1px solid #46553a;border-radius:11px;padding:14px;cursor:pointer;transition:.15s}
.loc:hover{border-color:#a5c273;background:rgba(140,180,90,.12);transform:translateY(-3px)}
.loc h3{color:#f0dfa8;font-size:16px;margin-bottom:4px}
.loc .d{font-size:12px;color:#94a382;line-height:1.5;min-height:66px;margin-bottom:8px}
#start .foot{margin-top:20px;color:#6f7d62;font-size:12px;text-align:center;line-height:1.8;max-width:660px}
#start .foot b{color:#b8c9a2}

/* ---------- Cheat menu ---------- */
#cheatTab{position:absolute;top:8px;right:8px;z-index:16;background:rgba(20,10,10,.85);border:1px solid #7a4a3a;color:#f0c090;
  font-size:11px;letter-spacing:1px;padding:5px 10px;border-radius:6px;cursor:pointer;pointer-events:auto}
#cheatTab:hover{background:rgba(40,18,18,.9);border-color:#c07a4a}
#cheatTab.active{background:rgba(60,20,20,.92);border-color:#e08a4a;color:#ffd9a0}
#cheat{position:absolute;top:36px;right:8px;width:252px;max-height:calc(100vh - 50px);overflow:auto;z-index:16;
  background:rgba(14,10,10,.94);border:1px solid #7a4a3a;border-radius:9px;padding:10px;pointer-events:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.6)}
#cheat h4{font-size:10.5px;letter-spacing:1.4px;color:#e08a4a;margin:10px 0 5px;border-bottom:1px solid #4a2e24;padding-bottom:3px}
#cheat h4:first-child{margin-top:0}
#cheat .row2{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
#cheat button{background:#2c1e1a;border:1px solid #6b4636;color:#f0dcc8;border-radius:5px;padding:4px 8px;font-size:11px;cursor:pointer;flex:1;min-width:0}
#cheat button:hover{background:#40281f;border-color:#c07a4a}
#cheat button.on{background:#4a6b36;border-color:#9dbd6d;color:#fff}
#cheat .stat2{display:flex;justify-content:space-between;font-size:11px;color:#d8c4b0;padding:1px 0}
#cheat .stat2 b{color:#ffd9a0}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud"></div>
<div id="bottomhud"></div>
<div id="keyhint"></div>
<div id="toasts"></div>
<div id="prompt" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="cheatTab" onclick="toggleCheat()">CHEATS ( ` )</div>
<div id="cheat" class="hidden"></div>

<div id="start">
  <h1>RANCH EMPIRE</h1>
  <div class="tag">RAISE &nbsp;·&nbsp; SLAUGHTER &nbsp;·&nbsp; HAGGLE &nbsp;·&nbsp; SURVIVE</div>
  <div id="locs"></div>
  <div class="foot">
    <b>WASD</b> move &nbsp;·&nbsp; <b>E</b> interact &nbsp;·&nbsp; <b>C</b> collect nearby &nbsp;·&nbsp; <b>B</b> build &nbsp;·&nbsp; <b>Click</b> attack &nbsp;·&nbsp; <b>F</b> mug &nbsp;·&nbsp; <b>1-5</b> weapons &nbsp;·&nbsp; <b>H</b> help<br>
    Pick where you set up. It changes your money, your neighbours, and how hard the county leans on you.
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   RANCH EMPIRE - top-down livestock business sim, single file, no deps.
   ========================================================================= */

/* ---------------------------------------------------------------- helpers */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const money=n=>'$'+Math.round(n).toLocaleString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let UID=1; const uid=()=>UID++;
const TILE=32;

/* ------------------------------------------------------------------- data */
const MEAT={
  cow    :{name:'Beef',       base:13.5},
  pig    :{name:'Pork',       base:12.0},
  sheep  :{name:'Mutton',     base:11.0},
  chicken:{name:'Chicken',    base:9.5},
  duck   :{name:'Duck',       base:14.5},
  horse  :{name:'Horse Meat', base:8.0}
};
const RES={
  milk   :{name:'Milk',      unit:'L',   base:3.5, col:'#f2f0e4'},
  egg    :{name:'Eggs',      unit:'dz',  base:6.0, col:'#e8d9a8'},
  wool   :{name:'Wool',      unit:'kg',  base:14.0,col:'#ded8cb'},
  truffle:{name:'Truffles',  unit:'ea',  base:26.0,col:'#5c4632'},
  manure :{name:'Manure',    unit:'bag', base:5.0, col:'#6b5334'},
  duckegg:{name:'Duck Eggs', unit:'dz',  base:9.0, col:'#cfe0d2'}
};

/* breed fields: grow = days to adult, prod = units/day, breed = days between births,
   meat = kg at full maturity, feed = feed units/day, price = $, q = quality bonus */
const SPECIES={
  cow:{name:'Cow',plural:'Cattle',res:'milk',sz:19,litter:[1,1],breeds:{
    holstein :{name:'Holstein', price:640, grow:11, prod:14.0, breed:20, meat:118, feed:2.9, q:0,  c1:'#f4f2ea',c2:'#2c2a28', d:'Milk machine. Eats like a tractor, breeds slow, mediocre carcass.'},
    angus    :{name:'Angus',    price:880, grow:10, prod:3.0,  breed:17, meat:172, feed:2.5, q:12, c1:'#232221',c2:'#111111', d:'Pure beef. Barely worth milking, but the carcass is money.'},
    jersey   :{name:'Jersey',   price:470, grow:8,  prod:9.5,  breed:11, meat:82,  feed:1.8, q:4,  c1:'#b98b52',c2:'#7a5730', d:'Cheap, quick, fertile. Small yields but they multiply.'},
    highland :{name:'Highland', price:760, grow:14, prod:5.0,  breed:21, meat:145, feed:1.3, q:16, c1:'#b3612c',c2:'#7d4118', d:'Hardy. Nearly free to feed, slow to raise, prime quality meat.'}
  }},
  pig:{name:'Pig',plural:'Pigs',res:'truffle',sz:15,litter:[2,4],breeds:{
    berkshire:{name:'Berkshire', price:340, grow:8, prod:0.32, breed:11, meat:76, feed:1.5, q:10, c1:'#332b26',c2:'#e6d7cd', d:'Black pig, marbled meat. Fair truffle nose.'},
    hampshire:{name:'Hampshire', price:300, grow:7, prod:0.18, breed:9,  meat:88, feed:1.7, q:2,  c1:'#3a3330',c2:'#efe6de', d:'Grows fast, eats plenty, huge litters. A meat factory.'},
    tamworth :{name:'Tamworth',  price:390, grow:9, prod:0.55, breed:13, meat:62, feed:1.1, q:6,  c1:'#c96f3a',c2:'#e5a077', d:'Ginger forager. Digs up serious truffle money, less meat.'},
    kunekune :{name:'Kunekune',  price:210, grow:6, prod:0.24, breed:7,  meat:34, feed:0.7, q:4,  c1:'#d9a98d',c2:'#8a5c46', d:'Tiny, cheap, breeds constantly. A starter herd in a box.'}
  }},
  sheep:{name:'Sheep',plural:'Sheep',res:'wool',sz:15,litter:[1,2],breeds:{
    merino :{name:'Merino',  price:300, grow:9,  prod:1.15, breed:14, meat:34, feed:1.1, q:2, c1:'#efeade',c2:'#d8cfbb', d:'The wool standard. Fleece pays, mutton is an afterthought.'},
    suffolk:{name:'Suffolk', price:340, grow:8,  prod:0.45, breed:12, meat:56, feed:1.3, q:9, c1:'#e6e1d4',c2:'#1e1c1a', d:'Black-faced meat sheep. Thick lamb, thin fleece.'},
    dorper :{name:'Dorper',  price:260, grow:7,  prod:0.20, breed:9,  meat:48, feed:0.9, q:5, c1:'#e9e3d6',c2:'#4a4640', d:'Sheds its own wool. Cheap, fertile, all about the carcass.'},
    romney :{name:'Romney',  price:280, grow:10, prod:0.90, breed:13, meat:44, feed:0.8, q:6, c1:'#f2eee2',c2:'#cfc7b4', d:'Balanced and thrifty. Good fleece, decent meat, low feed.'}
  }},
  chicken:{name:'Chicken',plural:'Chickens',res:'egg',sz:9,litter:[2,4],breeds:{
    leghorn  :{name:'Leghorn',   price:48, grow:4, prod:1.25, breed:4, meat:2.0, feed:0.22, q:0,  c1:'#f6f2e6',c2:'#d84a3a', d:'Egg belt. Lays nearly daily, almost no meat on it.'},
    orpington:{name:'Orpington', price:66, grow:6, prod:0.70, breed:6, meat:4.2, feed:0.30, q:8,  c1:'#e8b24a',c2:'#b9812b', d:'Fat, docile roaster. Half eggs, half dinner.'},
    cornish  :{name:'Cornish',   price:78, grow:5, prod:0.25, breed:7, meat:6.0, feed:0.38, q:12, c1:'#e2ddd0',c2:'#7d3b2e', d:'Broiler. Bulks up fast, barely lays.'},
    bantam   :{name:'Bantam',    price:30, grow:3, prod:0.55, breed:3, meat:1.1, feed:0.12, q:2,  c1:'#c98b3f',c2:'#3a2a1e', d:'Dirt cheap, breeds like a rumour. Everything about it is small.'}
  }},
  duck:{name:'Duck',plural:'Ducks',res:'duckegg',sz:10,litter:[2,4],breeds:{
    pekin  :{name:'Pekin',          price:82,  grow:5, prod:0.75, breed:6, meat:5.0, feed:0.30, q:10, c1:'#f7f3e2',c2:'#e8a92e', d:'White table duck. Premium meat, steady eggs.'},
    runner :{name:'Indian Runner',  price:70,  grow:4, prod:1.20, breed:5, meat:2.6, feed:0.24, q:2,  c1:'#d9cfae',c2:'#8a7440', d:'Stands upright, runs everywhere, lays constantly.'},
    muscovy:{name:'Muscovy',        price:110, grow:7, prod:0.45, breed:8, meat:8.5, feed:0.26, q:16, c1:'#26241f',c2:'#e4e0d4', d:'Big, lean, expensive. Chefs pay stupid money for it.'},
    khaki  :{name:'Khaki Campbell', price:64,  grow:4, prod:1.05, breed:4, meat:2.9, feed:0.20, q:4,  c1:'#9a7b4c',c2:'#5f4a2c', d:'Cheap egg engine. Breeds fast, feeds cheap.'}
  }},
  horse:{name:'Horse',plural:'Horses',res:'manure',sz:20,litter:[1,1],breeds:{
    quarter:{name:'Quarter Horse', price:1500, grow:15, prod:1.8, breed:28, meat:118, feed:2.2, q:6,  live:2100, spd:.06, c1:'#8a5a2e',c2:'#5c3a1c', d:'Steady ranch horse. Every adult you own makes you quicker on foot.'},
    clydes :{name:'Clydesdale',    price:2200, grow:18, prod:2.6, breed:32, meat:186, feed:3.2, q:4,  live:3100, spd:.04, c1:'#4a3120',c2:'#efe9dc', d:'Enormous. Piles of fertiliser, huge carcass, huge appetite.'},
    mustang:{name:'Mustang',       price:900,  grow:13, prod:1.2, breed:22, meat:96,  feed:1.2, q:8,  live:1250, spd:.09, c1:'#6b5240',c2:'#3a2c22', d:'Half-wild and cheap to keep. The fastest thing you can own.'},
    arabian:{name:'Arabian',       price:2900, grow:16, prod:1.4, breed:26, meat:88,  feed:1.9, q:10, live:4400, spd:.08, c1:'#d8cfc0',c2:'#9a8f7d', d:'Status symbol. Terrible meat value, sells live for a fortune.'}
  }}
};
const SPKEYS=Object.keys(SPECIES);

const STRUCTS={
  pen_s :{name:'Small Pen',      w:6,h:5, cost:280,  cap:5,  kinds:'*', d:'Fenced yard. Holds 5 head of one species.'},
  pen_l :{name:'Large Pen',      w:9,h:7, cost:820,  cap:12, kinds:'*', d:'Holds 12 head. Cheaper per animal than two small pens.'},
  coop  :{name:'Chicken Coop',   w:5,h:4, cost:400,  cap:10, kinds:['chicken','duck'], prod:.20, hp:10, d:'Birds only. +20% egg production and healthier flocks.'},
  barn  :{name:'Barn',           w:8,h:6, cost:1500, cap:9,  kinds:['cow','horse','pig','sheep'], prod:.20, hp:10, d:'Big stock only. +20% production, keeps them healthy.'},
  trough:{name:'Feed Trough',    w:2,h:1, cost:140,  d:'Drop it inside a pen: that pen eats 25% less feed.'},
  water :{name:'Water Trough',   w:2,h:1, cost:100,  d:'Drop it inside a pen: animals there recover health much faster.'},
  pond  :{name:'Duck Pond',      w:5,h:4, cost:460,  d:'+30% duck production across the whole farm.'},
  silo  :{name:'Feed Silo',      w:3,h:3, cost:950,  d:'+300 feed storage.'},
  shed  :{name:'Storage Shed',   w:5,h:4, cost:600,  d:'+400 product storage.'},
  abat  :{name:'Slaughterhouse', w:7,h:5, cost:2600, d:'+12 meat quality and +10% yield on every slaughter.'},
  cold  :{name:'Cold Store',     w:5,h:4, cost:1400, d:'Meat stops losing quality while it sits in your store.'},
  vet   :{name:'Vet Station',    w:5,h:4, cost:1900, d:'Sick animals recover. Almost nothing dies on you.'}
};
const STKEYS=Object.keys(STRUCTS);

/* Every structure can be improved after it is standing. Walk up to it and press E or G.
   Costs scale by 75% per level already bought, and by the location's build modifier. */
const UPG={
  pen_s:[
    {id:'space',name:'Extra Fencing',      cost:240, max:3, d:'+2 head of capacity per level.'},
    {id:'shade',name:'Shade & Windbreak',  cost:320, max:2, d:'+8% production and healthier stock in this pen.'},
    {id:'breed',name:'Breeding Program',   cost:420, max:3, d:'Females here give birth 14% sooner per level.'},
    {id:'auto', name:'Hired Hand',         cost:950, max:1, d:'Collects produce from this pen for you, around the clock.'}
  ],
  pen_l:[
    {id:'space',name:'Extra Fencing',      cost:420, max:3, d:'+2 head of capacity per level.'},
    {id:'shade',name:'Shade & Windbreak',  cost:480, max:2, d:'+8% production and healthier stock in this pen.'},
    {id:'breed',name:'Breeding Program',   cost:640, max:3, d:'Females here give birth 14% sooner per level.'},
    {id:'auto', name:'Hired Hand',         cost:1250,max:1, d:'Collects produce from this pen for you, around the clock.'}
  ],
  coop:[
    {id:'nest', name:'Nesting Boxes',      cost:440, max:2, d:'+15% eggs laid per level.'},
    {id:'space',name:'Extra Perches',      cost:340, max:2, d:'+3 birds of capacity per level.'},
    {id:'incub',name:'Incubator',          cost:560, max:2, d:'Eggs hatch 22% sooner per level.'},
    {id:'auto', name:'Egg Belt',           cost:780, max:1, d:'Eggs run straight into storage. No more walking the coop.'}
  ],
  barn:[

/* ------------------------------------------------------------- collisions */
function solidsFor(map){
  const out=[];
  if(map==='town'){ for(const b of TOWN) out.push({x:b.x,y:b.y,w:b.w,h:b.h}); }
  else{
    out.push({x:64,y:64,w:150,h:110}); // farmhouse
    for(const s of G.structs) if(structsSolid(s)) out.push({x:s.x,y:s.y,w:s.w,h:s.h});
  }
  return out;
}
function collide(ent,r){
  const solids=solidsFor(G.map);
  for(const s of solids){
    const cx=clamp(ent.x,s.x,s.x+s.w), cy=clamp(ent.y,s.y,s.y+s.h);
    const dx=ent.x-cx, dy=ent.y-cy, d=Math.hypot(dx,dy);
    if(d<r){
      if(d<0.001){ ent.y=s.y-r; continue; }
      ent.x=cx+dx/d*r; ent.y=cy+dy/d*r;
    }
  }
  ent.x=clamp(ent.x,r,worldW()-r); ent.y=clamp(ent.y,r,worldH()-r);
}
function blockedAt(x,y,r){
  for(const s of solidsFor(G.map)){
    const cx=clamp(x,s.x,s.x+s.w), cy=clamp(y,s.y,s.y+s.h);
    if(Math.hypot(x-cx,y-cy)<r) return true;
  }
  return false;
}

/* ----------------------------------------------------------------- player */
function playerSpeed(){
  let s=152;
  if(G.tools.quad) s*=1.35;
  let hb=0;
  for(const a of G.animals) if(a.sp==='horse'&&isAdult(a)) hb+=SPECIES.horse.breeds[a.br].spd;
  s*=1+Math.min(.25,hb);
  if(P.hp<30) s*=.8;
  return s;
}
function updatePlayer(dt){
  if(P.dead>0){ P.dead-=dt; if(P.dead<=0) revive(); return; }
  let dx=0,dy=0;
  if(K['w']||K['arrowup'])dy--; if(K['s']||K['arrowdown'])dy++;
  if(K['a']||K['arrowleft'])dx--; if(K['d']||K['arrowright'])dx++;
  const m=Math.hypot(dx,dy);
  const sp=playerSpeed();
  if(m>0){ dx/=m;dy/=m; P.x+=dx*sp*dt; P.y+=dy*sp*dt; P.anim+=dt*10; }
  else P.anim=0;
  collide(P,P.r);
  const wx=P.x-G.cam.x, wy=P.y-G.cam.y;
  P.face=Math.atan2(MOUSE.y-wy,MOUSE.x-wx);
  P.atk=Math.max(0,P.atk-dt); P.swing=Math.max(0,P.swing-dt);
  if(MOUSE.down&&P.atk<=0) attack();
  // camera
  const tx=clamp(P.x-VW/2,0,Math.max(0,worldW()-VW)), ty=clamp(P.y-VH/2,0,Math.max(0,worldH()-VH));
  G.cam.x+=(tx-G.cam.x)*Math.min(1,dt*8); G.cam.y+=(ty-G.cam.y)*Math.min(1,dt*8);
  if(worldW()<VW) G.cam.x=(worldW()-VW)/2;
  if(worldH()<VH) G.cam.y=(worldH()-VH)/2;
}
function hurtPlayer(n,src){
  if(P.dead>0) return;
  if(G.godmode){ fx(P.x,P.y-18,'BLOCKED','#8fd6ff'); return; }
  P.hp-=n; fx(P.x,P.y-18,'-'+Math.round(n),'#ff8a6a');
  if(P.hp<=0){ P.hp=0; P.dead=2.6; die(src); }
}
function die(src){
  const lost=Math.round(G.cash*.18);
  G.cash=Math.max(0,G.cash-lost);
  let lostA='';
  if(G.animals.length&&chance(.5)){ const a=pick(G.animals); removeAnimal(a); lostA=' A '+SPECIES[a.sp].name.toLowerCase()+' wandered off while you were out.'; }
  toast('<b>You were beaten unconscious.</b> Hospital took '+money(lost)+'.'+lostA,'bad');
  G.wanted=0; G.chaseT=0;
}
function revive(){
  P.hp=P.max; G.map='farm'; P.x=300;P.y=260; spawnTownIfNeeded();
  G.cam.x=clamp(P.x-VW/2,0,Math.max(0,FARM_W-VW)); G.cam.y=clamp(P.y-VH/2,0,Math.max(0,FARM_H-VH));
}

/* ------------------------------------------------------------------ clock */
function timeStr(){
  const h=Math.floor(G.tmin/60)%24, m=Math.floor(G.tmin%60);
  const ap=h<12?'am':'pm'; const hh=h%12===0?12:h%12;
  return hh+':'+(m<10?'0':'')+m+ap;
}
function nightAlpha(){
  const h=G.tmin/60;
  if(h>=7&&h<18) return 0;
  if(h>=18&&h<21) return (h-18)/3*.5;
  if(h>=21||h<4) return .5;
  return .5*(1-(h-4)/3);
}

const brOf=a=>SPECIES[a.sp].breeds[a.br];
const ageRatio=a=>clamp(a.age/brOf(a).grow,0,1);
const isAdult=a=>a.age>=brOf(a).grow;

function countStruct(k){return G.structs.filter(s=>s.k===k).length;}
/* ---- upgrades ---- */
function ulvl(s,id){ return (s&&s.up&&s.up[id])||0; }
function upgList(s){ return UPG[s.k]||[]; }
function upgDef(s,id){ return upgList(s).find(u=>u.id===id); }
function upgCost(s,u){ return Math.round(u.cost*(1+.75*ulvl(s,u.id))*M().build); }
function farmUp(k,id){ let n=0; for(const s of G.structs) if(s.k===k) n=Math.max(n,ulvl(s,id)); return n; }

function feedCap(){ let c=220; for(const s of G.structs) if(s.k==='silo') c+=300+200*ulvl(s,'rings'); return c; }
function prodCap(){ let c=320; for(const s of G.structs) if(s.k==='shed') c+=400+300*ulvl(s,'rack'); return c; }
function prodTotal(){let t=0;for(const k in G.prods)t+=G.prods[k];return t;}
function isPen(s){return STRUCTS[s.k].cap>0;}
function penCap(s){
  const d=STRUCTS[s.k]; if(!d.cap) return 0;
  return d.cap+(s.k==='pen_s'||s.k==='pen_l'?2:3)*ulvl(s,'space');
}
function penAnimals(s){return G.animals.filter(a=>a.pen===s.id);}
function penSpecies(s){const a=penAnimals(s);return a.length?a[0].sp:null;}
function penAccepts(s,sp){
  const def=STRUCTS[s.k]; if(!def.cap) return false;
  if(def.kinds!=='*' && def.kinds.indexOf(sp)<0) return false;
  const cur=penSpecies(s); if(cur&&cur!==sp) return false;
  return penAnimals(s).length<penCap(s);
}
function penFor(sp){
  // prefer a pen already holding this species (fullest first), then the smallest empty one
  const ok=G.structs.filter(s=>penAccepts(s,sp));
  if(!ok.length) return null;
  ok.sort((a,b)=>{
    const sa=penSpecies(a)===sp?0:1, sb=penSpecies(b)===sp?0:1;
    if(sa!==sb) return sa-sb;
    if(sa===0) return (penCap(b)-penAnimals(b).length)-(penCap(a)-penAnimals(a).length);
    return penCap(a)-penCap(b);
  });
  return ok[0];
}
function inRect(s,x,y){return x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h;}
function penGet(pen,k){ return G.structs.find(s=>s.k===k && s.x>=pen.x-8 && s.x+s.w<=pen.x+pen.w+8 && s.y>=pen.y-8 && s.y+s.h<=pen.y+pen.h+8)||null; }
function penHas(pen,k){ return !!penGet(pen,k); }

/* every per-pen number funnels through these, so upgrades apply everywhere at once */
function penFeedMult(pen){
  const t=penGet(pen,'trough');
  let m=t?.75-.08*ulvl(t,'hopper'):1;
  m*=1-.18*ulvl(pen,'feed');
  m*=1-.07*farmUp('silo','seal');
  return Math.max(.2,m);
}
function penHeal(pen){
  const w=penGet(pen,'water'), t=penGet(pen,'trough');
  let h=7+(STRUCTS[pen.k].hp||0);
  if(w) h+=9+8*ulvl(w,'filter');
  if(t) h+=6*ulvl(t,'lick');
  h+=4*ulvl(pen,'shade')+10*ulvl(pen,'heat');
  if(hasStruct('vet')) h+=14+10*farmUp('vet','care');
  return h;
}
function penProdMult(pen){
  const w=penGet(pen,'water');
  let m=1+(STRUCTS[pen.k].prod||0)+.08*ulvl(pen,'shade')+.15*ulvl(pen,'nest');
  if(w) m+=.06*ulvl(w,'mist');
  return m;
}
function penBreedMult(pen){ return 1+.14*ulvl(pen,'breed')+.22*ulvl(pen,'incub')+.12*farmUp('vet','fert'); }
function penGrowMult(pen){ return 1+.10*ulvl(pen,'heat')+.12*farmUp('vet','growth'); }
function pondBonus(){ let b=0; for(const s of G.structs) if(s.k==='pond') b=Math.max(b,.30+.10*ulvl(s,'reeds')); return b; }
function packMult(){ return 1+.05*farmUp('cold','pack'); }

function addStruct(k,tx,ty,free){
  const d=STRUCTS[k];
  const s={id:uid(),k,tx,ty,x:tx*TILE,y:ty*TILE,w:d.w*TILE,h:d.h*TILE,up:{}};
  G.structs.push(s);
  if(!free) G.cash-=Math.round(d.cost*M().build);
  return s;
}
function structFits(k,tx,ty){
  const d=STRUCTS[k], r=farmRect();
  const x=tx*TILE,y=ty*TILE,w=d.w*TILE,h=d.h*TILE;
  if(x<r.x||y<r.y||x+w>r.x+r.w||y+h>r.y+r.h) return false;
  const house={x:64,y:64,w:150,h:110};
  if(x<house.x+house.w&&x+w>house.x&&y<house.y+house.h&&y+h>house.y) return false;
  const small=(d.w<=2&&d.h<=1); // troughs may sit inside pens
  for(const s of G.structs){
    const sd=STRUCTS[s.k];
    if(small&&sd.cap) continue;
    if(sd.w<=2&&sd.h<=1&&d.cap) continue;
    if(x<s.x+s.w&&x+w>s.x&&y<s.y+s.h&&y+h>s.y) return false;
  }
  return true;
}
function startBuild(k){ G.build={k}; closeUI(); toast('Placing <b>'+STRUCTS[k].name+'</b>. Left click to build, right click or Esc to cancel.'); }
function cancelBuild(){ G.build=null; }
function buildGhost(){
  if(!G.build) return null;
  const d=STRUCTS[G.build.k];
  const wx=MOUSE.x+G.cam.x, wy=MOUSE.y+G.cam.y;
  const tx=Math.round((wx-d.w*TILE/2)/TILE), ty=Math.round((wy-d.h*TILE/2)/TILE);
  return {tx,ty,x:tx*TILE,y:ty*TILE,w:d.w*TILE,h:d.h*TILE,ok:structFits(G.build.k,tx,ty)&&G.cash>=Math.round(d.cost*M().build)};
}
function placeBuild(){
  const g=buildGhost(); if(!g) return;
  const d=STRUCTS[G.build.k];
  const cost=Math.round(d.cost*M().build);
  if(!structFits(G.build.k,g.tx,g.ty)){ toast('It will not fit there.','bad'); return; }
  if(G.cash<cost){ toast('You cannot afford that.','bad'); return; }
  addStruct(G.build.k,g.tx,g.ty,false);
  toast('Built <b>'+d.name+'</b> for '+money(cost)+'.','good');
  if(!K['shift']) G.build=null;
}

/* ---------------------------------------------------------------- animals */
function animalName(sp){
  const N={cow:['Bessie','Dot','Clover','Moonpie','Duchess','Rump','Tank','Nugget'],
           pig:['Truffle','Hamlet','Bacon','Pickle','Sausage','Muddy','Chops'],
           sheep:['Cotton','Baabra','Fluff','Mutton','Cloud','Woolly'],
           chicken:['Nugget','Pecky','Omelette','Feathers','Colonel','Drumstick'],
           duck:['Quackers','Puddle','Bill','Waddles','Drake','Splash'],
           horse:['Comet','Dusty','Bandit','Whisper','Thunder','Biscuit']};
  return pick(N[sp]);
}
function spawnAnimal(sp,br,pen,sex,age){
  const b=SPECIES[sp].breeds[br];
  const px=rnd(pen.x+16,pen.x+pen.w-16), py=rnd(pen.y+20,pen.y+pen.h-16);
  const a={id:uid(),sp,br,name:animalName(sp),sex:sex||(chance(.5)?'M':'F'),
    age:age===undefined?b.grow:age, pen:pen.id, x:px,y:py, tx:px,ty:py, t:rnd(0,3),
    full:88, hp:96, prod:0, breedT:rnd(0,b.breed*.4), flip:chance(.5)};
  G.animals.push(a);
  return a;
}
function removeAnimal(a){ const i=G.animals.indexOf(a); if(i>=0) G.animals.splice(i,1); }

function updateAnimals(dt,dd){
  const pond=pondBonus();
  const vet=hasStruct('vet');
  for(let i=G.animals.length-1;i>=0;i--){
    const a=G.animals[i], b=brOf(a), pen=G.structs.find(s=>s.id===a.pen);
    if(!pen){ removeAnimal(a); continue; }
    const pd=STRUCTS[pen.k];
    a.age+=dd*penGrowMult(pen);
    // --- feed
    const need=b.feed*dd*M().feed*penFeedMult(pen);
    if(G.feed>=need){ G.feed-=need; a.full=Math.min(100,a.full+55*dd); }
    else { G.feed=0; a.full=Math.max(0,a.full-48*dd); }
    // --- health
    const heal=penHeal(pen);
    if(a.full<25) a.hp-=(vet?4:11)*dd; else a.hp=Math.min(100,a.hp+heal*dd);
    if(a.hp<=0){
      if(vet){a.hp=6;}
      else{ toast('<b>'+esc(a.name)+'</b> the '+b.name.toLowerCase()+' starved to death.','bad'); removeAnimal(a); continue; }
    }
    // --- production
    if(isAdult(a)){
      let f=(.35+.65*a.full/100)*(.45+.55*a.hp/100)*M().prod*penProdMult(pen);
      if(a.sp==='duck') f*=1+pond;
      if(a.sex==='M'&&(a.sp==='cow')) f*=.15;
      a.prod+=b.prod*dd*f;
      // --- a Hired Hand / Egg Belt / Milking Rig empties this pen for you
      if(ulvl(pen,'auto')&&a.prod>=1){
        const res=SPECIES[a.sp].res, space=prodCap()-prodTotal();
        const n=Math.min(Math.floor(a.prod),space);
        if(n>0){ a.prod-=n; G.prods[res]+=n; G.autoDay[res]=(G.autoDay[res]||0)+n; }
      }
      // --- breeding
      if(a.sex==='F'){
        const mate=penAnimals(pen).some(o=>o.sex==='M'&&isAdult(o));
        if(mate){
          a.breedT+=dd*penBreedMult(pen);
          if(a.breedT>=b.breed){
            a.breedT=0;
            const lit=ri(SPECIES[a.sp].litter[0],SPECIES[a.sp].litter[1]);
            let born=0;
            for(let n=0;n<lit;n++){ if(penAnimals(pen).length<penCap(pen)){ spawnAnimal(a.sp,a.br,pen,undefined,0); born++; } }
            if(born){ G.stats.born+=born; toast('<b>'+esc(a.name)+'</b> gave birth to '+born+' '+(born>1?'young':'one')+'.','good'); }
            else toast('<b>'+esc(a.name)+'</b> is ready to breed but the pen is full.','bad');
          }
        }
      }
    }
    // --- wander
    a.t-=dt;
    if(a.t<=0){ a.t=rnd(1.4,4.2); a.tx=rnd(pen.x+14,pen.x+pen.w-14); a.ty=rnd(pen.y+18,pen.y+pen.h-14); }
    const dx=a.tx-a.x, dy=a.ty-a.y, dm=Math.hypot(dx,dy);
    if(dm>3){ const sp=(SPECIES[a.sp].sz>14?15:22)*(isAdult(a)?1:1.3); a.x+=dx/dm*sp*dt; a.y+=dy/dm*sp*dt; a.flip=dx<0; }
  }
  // meat: rots in the open, holds in a cold store, improves in a dry ageing room
  const cold=G.structs.find(s=>s.k==='cold');
  for(const m of G.meats){
    if(m.q0===undefined) m.q0=m.q;
    if(!cold) m.q=Math.max(4,m.q-1.7*dd);
    else if(ulvl(cold,'age')) m.q=Math.min(99,Math.min(m.q0+14,m.q+1.1*dd));
  }
}

function collectRadius(){return G.tools.bucket?190:115;}
function collectNearby(){
  if(G.map!=='farm'){ toast('Nothing to collect in town.','bad'); return; }
  const R=collectRadius(); let got={}, any=0, full=false;
  for(const a of G.animals){
    if(a.prod<1||dist(a,P)>R) continue;
    const res=SPECIES[a.sp].res;
    const space=prodCap()-prodTotal();
    if(space<=0){ full=true; break; }
    const n=Math.min(Math.floor(a.prod),space);
    if(n<1){ full=true; break; }
    a.prod-=n; G.prods[res]+=n; got[res]=(got[res]||0)+n; any+=n;
    fx(a.x,a.y-16,'+'+n+' '+RES[res].name,RES[res].col);
  }
  if(!any){ toast(full?'Your storage is full. Sell some produce.':'Nothing ready within reach.','bad'); return; }
  toast('Collected '+Object.keys(got).map(k=>got[k]+' '+RES[k].name).join(', ')+'.','good');
  if(full) toast('Storage is now full.','bad');
}
function qLabel(q){
  if(q>=85)return['PRIME','q4'];
  if(q>=68)return['GOOD','q3'];
  if(q>=45)return['FAIR','q2'];
  return['POOR','q1'];
}
/* one formula, used by both the slaughter itself and the preview on the animal panel */
function meatEstimate(a){
  const b=brOf(a), ar=ageRatio(a);
  const abat=G.structs.find(s=>s.k==='abat');
  const kg=Math.max(.4, b.meat*(.12+.88*ar)*(abat?1.1+.08*ulvl(abat,'yield'):1));
  const q=clamp(6+58*Math.pow(ar,1.4)+(a.hp-70)*.20+(a.full-60)*.10+(b.q||0)*.8+
                (abat?10+6*ulvl(abat,'blade'):0),4,99);
  return {kg,q};
}
function slaughter(a,quiet){
  const b=brOf(a), ar=ageRatio(a);
  const e=meatEstimate(a), kg=e.kg, q=e.q;
  G.meats.push({id:uid(),sp:a.sp,br:a.br,kg:Math.round(kg*10)/10,q:Math.round(q),day:G.day,
                name:MEAT[a.sp].name+' ('+b.name+')'});
  G.stats.slaughtered++;
  removeAnimal(a);
  if(quiet) return;
  const L=qLabel(q);
  toast('Slaughtered <b>'+esc(a.name)+'</b> &rarr; '+Math.round(kg)+'kg of '+MEAT[a.sp].name.toLowerCase()+', quality <b>'+L[0]+'</b> ('+Math.round(q)+').',ar<.85?'bad':'good');
  if(ar<.85) toast('Killed young. That meat will be hard to sell.','bad');
}
function liveValue(a){
  const b=brOf(a);
  const base=b.live||b.price*1.15;
  return Math.round(base*(.35+.65*ageRatio(a))*(.7+.3*a.hp/100)*M().animal);
}

/* =========================================================================
   PEOPLE: civilians, rivals, cops, violence, crime
   ========================================================================= */
function carrying(){ return !G.holster && WEAPONS[G.weapon].illegal; }
function nearestNpc(maxd,f){
  let best=null,bd=maxd;
  for(const n of G.npcs){ if(n.dead)continue; if(f&&!f(n))continue; const d=dist(n,P); if(d<bd){bd=d;best=n;} }
  return best;
}
function witnesses(x,y,r){ return G.npcs.filter(n=>!n.dead&&n.type==='cop'&&Math.hypot(n.x-x,n.y-y)<r); }
function raiseWanted(n,why){
  if(G.noHeat) return;
  const old=G.wanted;
  G.wanted=Math.max(G.wanted,n); G.chaseT=0;
  if(G.wanted>old) toast('<b>SHERIFF ALERTED</b> &mdash; '+why,'cop');
}
function updateNpcs(dt){
  if(G.map!=='town'){ return; }
  const gunCops=G.wanted>=3;
  for(let i=G.npcs.length-1;i>=0;i--){
    const n=G.npcs[i];
    if(n.dead){ n.dead-=dt; if(n.dead<=0) G.npcs.splice(i,1); continue; }
    n.atk=Math.max(0,n.atk-dt);
    const dp=dist(n,P);

    if(n.type==='cop'){
      // spot illegal weapon
      if(!G.wanted && carrying() && dp<230*M().heat && P.dead<=0) raiseWanted(1,'a deputy spotted your '+WEAPONS[G.weapon].name.toLowerCase()+'.');
      if(G.wanted>0&&P.dead<=0){
        const dx=P.x-n.x,dy=P.y-n.y,dm=Math.hypot(dx,dy)||1;
        n.x+=dx/dm*(78+G.wanted*7)*dt; n.y+=dy/dm*(78+G.wanted*7)*dt; n.face=Math.atan2(dy,dx);
        if(gunCops&&dm<330&&n.atk<=0){ n.atk=1.3; shoot(n,P.x,P.y,13,300,'#ffd27a'); }
        if(dm<26) arrest();
      } else patrol(n,dt);
      collide(n,10); continue;
    }
    if(n.aggro&&P.dead<=0){
      const dx=P.x-n.x,dy=P.y-n.y,dm=Math.hypot(dx,dy)||1;
      const w=WEAPONS[n.weapon||'fists'];
      n.face=Math.atan2(dy,dx);
      const want=w.kind==='gun'?190:22;
      if(dm>want){ n.x+=dx/dm*72*dt; n.y+=dy/dm*72*dt; }
      if(n.atk<=0&&dm<(w.kind==='gun'?340:34)){
        n.atk=w.cd*1.5;
        if(w.kind==='gun') shoot(n,P.x,P.y,w.dmg*.6,340,'#ffcf7a');
        else { hurtPlayer(w.dmg*.7,n.name); fx(P.x,P.y-24,w.name+'!','#ff9a7a'); }
      }
    } else patrol(n,dt);
    collide(n,10);
  }
  // losing the cops on foot
  if(G.wanted>0){
    const close=G.npcs.some(n=>!n.dead&&n.type==='cop'&&dist(n,P)<470);
    if(close) G.chaseT=0; else { G.chaseT+=dt; if(G.chaseT>12){ G.wanted=0; G.chaseT=0; toast('You lost them.','cop'); } }
  }
}
function patrol(n,dt){
  n.t-=dt;
  if(n.t<=0){ n.t=rnd(2,6); n.tx=clamp(n.x+rnd(-260,260),40,TOWN_W-40); n.ty=clamp(n.y+rnd(-260,260),40,TOWN_H-40); }
  const dx=n.tx-n.x,dy=n.ty-n.y,dm=Math.hypot(dx,dy);
  if(dm>4){ n.x+=dx/dm*n.spd*dt; n.y+=dy/dm*n.spd*dt; n.face=Math.atan2(dy,dx); }
}
function shoot(from,tx,ty,dmg,spd,col,spread){
  const a=Math.atan2(ty-from.y,tx-from.x)+rnd(-(spread||.05),(spread||.05));
  G.bullets.push({x:from.x,y:from.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg,life:1.6,
                  own:from===P?'p':'n',col:col||'#ffe6a0'});
}
function updateBullets(dt){
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    let gone=b.life<=0||blockedAt(b.x,b.y,2)||b.x<0||b.y<0||b.x>worldW()||b.y>worldH();
    if(!gone){
      if(b.own==='p'){
        for(const n of G.npcs){ if(n.dead)continue; if(Math.hypot(n.x-b.x,n.y-b.y)<13){ damageNpc(n,b.dmg); gone=true; break; } }
      }else if(P.dead<=0&&Math.hypot(P.x-b.x,P.y-b.y)<12){ hurtPlayer(b.dmg*(G.tools.vest?.6:1)); gone=true; }
    }
    if(gone) G.bullets.splice(i,1);
  }
}
function attack(){
  if(P.dead>0||P.atk>0) return;
  const w=WEAPONS[G.weapon];
  G.holster=false;
  if(w.kind==='gun'){
    if(G.ammo[w.ammo]<=0){ toast('Out of '+(w.ammo==='shell'?'shells':'rounds')+'.','bad'); P.atk=.4; return; }
    G.ammo[w.ammo]--; P.atk=w.cd; P.swing=.12;
    const tx=MOUSE.x+G.cam.x, ty=MOUSE.y+G.cam.y;
    const pel=w.pellets||1;
    for(let i=0;i<pel;i++) shoot(P,tx,ty,w.dmg,w.reach*2.2,'#ffe6a0',w.spread||.035);
    if(G.map==='town'){
      const wit=witnesses(P.x,P.y,520);
      if(wit.length) raiseWanted(3,'shots fired in town.');
      else raiseWanted(2,'someone called in gunfire.');
    }
    return;
  }
  P.atk=w.cd; P.swing=.18;
  let hit=0;
  for(const n of G.npcs){
    if(n.dead) continue;
    const d=dist(n,P); if(d>w.reach+10) continue;
    let da=Math.atan2(n.y-P.y,n.x-P.x)-P.face;
    while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
    if(Math.abs(da)>1.1) continue;
    damageNpc(n,w.dmg); hit++;
  }
  if(hit&&G.map==='town'){
    if(witnesses(P.x,P.y,360).length) raiseWanted(2,'a deputy watched you swing at somebody.');
  }
}
function damageNpc(n,dmg){
  n.hp-=dmg; n.aggro=true; n.hitT=.14;
  fx(n.x,n.y-20,'-'+Math.round(dmg),'#ffb27a');
  if(n.type==='civ'&&!n.weapon&&chance(.5)) n.weapon=pick(['fists','knife','bat']);
  if(n.type==='cop') raiseWanted(3,'you assaulted a deputy.');
  if(n.hp<=0) npcDeath(n);
}
function npcDeath(n){
  n.dead=6; n.aggro=false; G.stats.killed++;
  const drop=n.type==='civ'?ri(20,120):(n.type==='rival'?ri(300,900):ri(40,160));
  G.cash+=drop; fx(n.x,n.y-26,'+'+money(drop),'#8fd66a');
  G.rep=clamp(G.rep-(n.type==='rival'?9:4),0,100);
  if(n.rival){ const r=G.rivals.find(r=>r.id===n.rival); if(r){r.dead=true;r.partner=false;}
    toast('<b>'+esc(n.name)+' is dead.</b> Word travels fast in this county.','bad'); }
  else toast(esc(n.name)+' is dead. You took '+money(drop)+' off them.','bad');
  if(G.map==='town'){ if(witnesses(n.x,n.y,600).length) raiseWanted(3,'a killing was witnessed.'); else raiseWanted(2,'a body was found.'); }
}
function mug(){
  if(G.map!=='town'){ toast('Nobody out here to rob.','bad'); return; }
  const n=nearestNpc(52,t=>t.type==='civ'&&!t.aggro);
  if(!n){ toast('Get closer to somebody first.','bad'); return; }
  G.stats.mugged++;
  const seen=witnesses(n.x,n.y,420).length>0;
  if(chance(.65)){
    const take=Math.round(n.cash*rnd(.8,1.6))+ri(10,40);
    G.cash+=take; n.cash=0; n.t=0; n.tx=n.x+rnd(-300,300); n.ty=n.y+rnd(-300,300); n.spd=110;
    G.rep=clamp(G.rep-1.6,0,100);
    fx(n.x,n.y-26,'+'+money(take),'#8fd66a');
    toast('<b>'+esc(n.name)+'</b> handed over '+money(take)+' and ran.','bad');
  }else{
    const roll=Math.random();
    n.weapon = roll<.25?'handgun' : (roll<.75?'knife':'bat');
    n.aggro=true; n.spd=86; n.hp=n.max=Math.round(n.max*1.2);
    toast('<b>'+esc(n.name)+' fights back</b> &mdash; they have a '+WEAPONS[n.weapon].name.toLowerCase()+'!','bad');
  }
  if(seen) raiseWanted(2,'a deputy saw the robbery.');
}
function arrest(){
  if(P.dead>0) return;
  const fine=Math.round(G.cash*rnd(.12,.22))+ri(60,180);
  G.cash=Math.max(0,G.cash-fine);
  let seized=0;
  const n=ri(1,2);
  for(let i=0;i<n;i++){ if(G.animals.length&&chance(.75)){ removeAnimal(pick(G.animals)); seized++; } }
  G.wanted=0; G.chaseT=0; G.stats.arrests++;
  // confiscate illegal weapons
  let lost=[];
  for(const k of ['handgun','shotgun']) if(G.owned[k]){ delete G.owned[k]; lost.push(WEAPONS[k].name); }
  G.weapon='fists';
  G.ammo.pistol=0; G.ammo.shell=0;
  let vault='';
  if(G.bank.heist){
    const held=G.bank.balance; G.bank.balance=0; G.bank.heist=false;
    G.rep=clamp(G.rep-6,0,100);
    vault=held>=1?', and the bank seized the '+money(held)+' you had on deposit':', and the bank closed your account';
  }
  const st=TOWN.find(t=>t.k==='police');
  P.x=st.door.x; P.y=st.door.y+40;
  toast('<b>BOOKED.</b> Fine of '+money(fine)+(seized?', '+seized+' head of stock seized':'')+
        (lost.length?', '+lost.join(' and ')+' confiscated':'')+vault+'.','bad');
}

/* -------------------------------------------------------------- interact */
function nearCar(){
  const c=CARSPOT[G.map];
  return Math.hypot(P.x-c.x,P.y-c.y)<52;
}
function nearBuilding(){
  if(G.map!=='town') return null;
  for(const b of TOWN) if(Math.hypot(P.x-b.door.x,P.y-b.door.y)<58) return b;
  return null;
}
function nearAnimal(){
  if(G.map!=='farm') return null;
  let best=null,bd=52;
  for(const a of G.animals){ const d=dist(a,P); if(d<bd){bd=d;best=a;} }
  return best;
}
function openAnimal(a){ openUI('animal',{id:a.id}); }
function interact(){
  if(P.dead>0) return;
  if(nearCar()){ travel(); return; }
  const b=nearBuilding();
  if(b){ enterBuilding(b); return; }
  const n=nearestNpc(50,t=>!t.dead);
  if(n){
    if(n.type==='rival'){ openRival(n); return; }
    if(n.type==='cop'){ toast(G.wanted? '"Stop right there!"' : '"Keep it clean today."','cop'); return; }
    toast('<b>'+esc(n.name)+':</b> '+pick(['"Morning."','"Hot one today."','"Heard the market is moving."','"You are the one with the farm out east?"','"Mind yourself."']));
    return;
  }
  const a=nearAnimal();
  if(a){ openAnimal(a); return; }
  const s=nearStruct();
  if(s){ openStruct(s); return; }
  toast('Nothing to interact with here.','bad');
}
function manageStruct(){
  if(G.map!=='farm'){ toast('Your buildings are back at the farm.','bad'); return; }
  const s=nearStruct();
  if(s) openStruct(s); else toast('Stand next to one of your structures.','bad');
}
function travel(){
  const to=G.map==='farm'?'town':'farm';
  if(G.wanted>0&&G.map==='town'){
    toast('<b>You floor it out of town.</b> No charges, no witnesses.','cop');
    if(G.bank.heist){ G.bank.heist=false; toast('You got clean away with the bank job.','bad'); }
  }
  G.wanted=0; G.chaseT=0; G.bullets=[];
  G.map=to;
  if(to==='town'){ spawnTown(); P.x=CARSPOT.town.x; P.y=CARSPOT.town.y+56; }
  else { G.npcs=[]; P.x=CARSPOT.farm.x; P.y=CARSPOT.farm.y+56; }
  G.cam.x=clamp(P.x-VW/2,0,Math.max(0,worldW()-VW));
  G.cam.y=clamp(P.y-VH/2,0,Math.max(0,worldH()-VH));
  toast(to==='town'?'Drove into town.':'Back at the farm.');
  save();
}

function openUI(name,data){ G.ui={name,data:data||{}}; renderUI(); $modal.classList.remove('hidden'); }
function closeUI(){ G.ui=null; G.market=null; $modal.classList.add('hidden'); $modal.innerHTML=''; }
function renderUI(){ if(!G.ui) return; const f=UIS[G.ui.name]; if(f) $modal.innerHTML=f(G.ui.data); }
function panel(title,sub,body,foot,cls){
  return '<div class="panel '+(cls||'')+'"><div class="ph"><h2>'+title+'</h2><div class="sub">'+(sub||'')+
    '</div><button class="x" onclick="closeUI()">CLOSE  ESC</button></div><div class="pb">'+body+'</div>'+
    (foot?'<div class="pf">'+foot+'</div>':'')+'</div>';
}
function walletFoot(extra){
  return 'Cash <b class="money">'+money(G.cash)+'</b> &nbsp;·&nbsp; Reputation <b>'+Math.round(G.rep)+'/100</b>'+(extra?' &nbsp;·&nbsp; '+extra:'');
}
function repWord(){
  const r=G.rep;
  if(r>=85)return'Legendary';if(r>=70)return'Trusted';if(r>=55)return'Respected';
  if(r>=40)return'Known';if(r>=25)return'Doubted';if(r>=12)return'Distrusted';return'Blacklisted';
}
function enterBuilding(b){
  if(b.k==='police'&&G.wanted>0){ surrender(); return; }
  if(b.k==='auction') openUI('auction',{sp:'cow',tab:'buy'});
  else if(b.k==='store') openUI('store');
  else if(b.k==='market') openMarket();
  else if(b.k==='realtor') openUI('realtor');
  else if(b.k==='diner') openUI('diner');
  else if(b.k==='guns') openUI('guns');
  else if(b.k==='bank') openUI('bank');
  else if(b.k==='police') openUI('police');
}

function aCollect(id){
  const a=G.animals.find(x=>x.id===id); if(!a) return;
  const res=SPECIES[a.sp].res, space=prodCap()-prodTotal();
  const n=Math.min(Math.floor(a.prod),space);
  if(n<1){ toast('Storage is full.','bad'); return; }
  a.prod-=n; G.prods[res]+=n; toast('+'+n+' '+RES[res].name,'good'); renderUI();
}
function aSlaughter(id){
  const a=G.animals.find(x=>x.id===id); if(!a) return;
  slaughter(a); closeUI();
}
function aMove(id,pid){
  const a=G.animals.find(x=>x.id===id), p=G.structs.find(s=>s.id===pid);
  if(!a||!p||!penAccepts(p,a.sp)) return;
  a.pen=p.id; a.x=a.tx=rnd(p.x+16,p.x+p.w-16); a.y=a.ty=rnd(p.y+20,p.y+p.h-16);
  toast(esc(a.name)+' moved to the '+STRUCTS[p.k].name.toLowerCase()+'.'); renderUI();
}

function nearStruct(){
  if(G.map!=='farm') return null;
  let best=null,bd=1e9;
  for(const s of G.structs){
    const cx=clamp(P.x,s.x,s.x+s.w), cy=clamp(P.y,s.y,s.y+s.h);
    const d=Math.hypot(P.x-cx,P.y-cy);
    if(d<42&&d<bd){ bd=d; best=s; }
  }
  return best;
}

function buyUpg(sid,id){
  const s=G.structs.find(x=>x.id===sid); if(!s) return;
  const u=upgDef(s,id); if(!u) return;
  const lv=ulvl(s,id); if(lv>=u.max) return;
  const cost=upgCost(s,u);
  if(G.cash<cost){ toast('Not enough cash.','bad'); return; }
  G.cash-=cost; s.up=s.up||{}; s.up[id]=lv+1;
  toast('<b>'+u.name+'</b> installed on the '+STRUCTS[s.k].name.toLowerCase()+' for '+money(cost)+'.','good');
  renderUI(); save();
}
function togUpg(sid,id){
  const s=G.structs.find(x=>x.id===sid); if(!s) return;
  s.tog=s.tog||{}; s.tog[id]=!togOn(s,id);
  renderUI();
}
function demolish(sid){
  const s=G.structs.find(x=>x.id===sid); if(!s) return;
  if(isPen(s)&&penAnimals(s).length){ toast('Move the animals out first.','bad'); return; }
  const refund=Math.round(STRUCTS[s.k].cost*M().build*.4);
  G.cash+=refund; G.structs.splice(G.structs.indexOf(s),1);
  toast('Pulled down the '+STRUCTS[s.k].name.toLowerCase()+'. Got '+money(refund)+' back.','good');
  closeUI(); save();
}

    '</div></div>', walletFoot());

function dailyFeed(){ let t=0; for(const a of G.animals) t+=brOf(a).feed*M().feed; return t; }
function sellProduct(k,n){
  let tot=0,lines=[];
  const keys=k==='*'?Object.keys(G.prods):[k];
  for(const key of keys){
    const q=Math.floor(G.prods[key]); if(q<=0) continue;
    const amt=n>0?Math.min(n,q):q;
    const per=RES[key].base*(G.priceMult[key]||1);
    G.prods[key]-=amt; tot+=amt*per; lines.push(amt+' '+RES[key].name);
  }
  if(!tot){ toast('Nothing to sell.','bad'); return; }
  G.cash+=tot; G.stats.earned+=tot;
  G.rep=clamp(G.rep+.15,0,100);
  toast('Sold '+lines.join(', ')+' for <b class="money">'+money(tot)+'</b>.','good');
  renderUI();
}
function buyFeed(n){
  const fp=feedPrice();
  if(n<0) n=Math.floor(feedCap()-G.feed);
  n=Math.min(n,Math.floor(feedCap()-G.feed),Math.floor(G.cash/fp));
  if(n<=0){ toast(G.feed>=feedCap()-1?'Silo is full.':'Not enough cash.','bad'); return; }
  G.cash-=n*fp; G.feed+=n;
  toast('Bought '+n+' feed for '+money(n*fp)+'.','good'); renderUI();
}
function buyTool(k,c){
  if(G.cash<c||G.tools[k]) return;
  G.cash-=c; G.tools[k]=true;
  if(k==='vest') P.max=150,P.hp=Math.min(P.max,P.hp+50);
  toast('Bought it.','good'); renderUI();
}

/* ------------------------------------------------------------------ bank */
function loanCap(){ return Math.round(1800+G.rep*70); }
function bankDay(notes){
  const b=G.bank;
  if(b.balance>0){
    const int=b.balance*b.rate; b.balance+=int;
    if(int>=1) notes.push('Savings earned '+money(int)+' in interest.');
  }
  if(b.loan>0){
    b.loan*=1.06; b.due--;
    if(b.due<=0){
      const grab=Math.min(G.cash,b.loan);
      G.cash-=grab; b.loan-=grab;
      let seized=0;
      while(b.loan>1&&G.animals.length&&seized<3){ const a=pick(G.animals); b.loan-=liveValue(a); removeAnimal(a); seized++; }
      if(b.loan<0) b.loan=0;
      G.rep=clamp(G.rep-3,0,100);
      notes.push('<span class="bad">The bank called your loan &mdash; took '+money(grab)+
        (seized?' and '+seized+' head of stock':'')+'.</span>');
      if(b.loan<=1){ b.loan=0; notes.push('Loan settled.'); } else b.due=3;
    } else if(b.due<=3) notes.push('<span class="warn">Loan of '+money(b.loan)+' falls due in '+b.due+' day'+(b.due===1?'':'s')+'.</span>');
  }
}
function spawnCopsAt(x,y,n){
  for(let i=0;i<n;i++){
    const c=newNpc('cop',clamp(x+rnd(-260,260),40,TOWN_W-40),clamp(y+rnd(-260,260),40,TOWN_H-40));
    G.npcs.push(c);
  }
}

function bankDeposit(f){
  const n=Math.floor(G.cash*f); if(n<1){ toast('Nothing to deposit.','bad'); return; }
  G.cash-=n; G.bank.balance+=n; toast('Deposited '+money(n)+'.','good'); renderUI(); save();
}
function bankWithdraw(f){
  const n=Math.floor(G.bank.balance*f); if(n<1){ toast('Nothing on deposit.','bad'); return; }
  G.bank.balance-=n; G.cash+=n; toast('Withdrew '+money(n)+'.','good'); renderUI(); save();
}
function bankLoan(f){
  if(G.bank.loan>0){ toast('Settle the loan you already have.','bad'); return; }
  const n=Math.round(loanCap()*f);
  G.bank.loan=n; G.bank.due=10; G.cash+=n;
  toast('Borrowed <b>'+money(n)+'</b>. Due in 10 days at 6% a day.','good'); renderUI(); save();
}
function bankRepay(f){
  const b=G.bank;
  const n=Math.min(G.cash,f>=1?b.loan:b.loan*f);
  if(n<1){ toast('You have nothing to pay with.','bad'); return; }
  G.cash-=n; b.loan-=n;
  if(b.loan<=1){ b.loan=0; b.due=0; G.rep=clamp(G.rep+2,0,100); toast('Loan cleared. The bank likes you a little more.','good'); }
  else toast('Paid '+money(n)+' off the loan.','good');
  renderUI(); save();
}
function bankRob(){
  const b=G.bank;
  if(!carrying()){ toast('You would need a gun in your hand for that.','bad'); return; }
  if(G.day-b.robbedDay<3){ toast('Nothing left in the drawers yet.','bad'); return; }
  const take=Math.round((1500+G.day*95+ri(0,900))*Math.max(.3,1-b.sec*.22)*(G.weapon==='shotgun'?1.25:1));
  G.cash+=take; b.robbedDay=G.day; b.sec++; b.heist=true;
  G.rep=clamp(G.rep-12,0,100);
  G.stats.robs=(G.stats.robs||0)+1;
  closeUI();
  const bd=TOWN.find(t=>t.k==='bank');
  P.x=bd.door.x; P.y=bd.door.y+34;
  raiseWanted(3,'you just held up the county bank.');
  spawnCopsAt(bd.door.x,bd.door.y,4);
  toast('<b>'+money(take)+' out of the drawers.</b> Get to the car.','bad');
}

function surrender(){
  const fine=Math.round(G.cash*.1)+ri(40,120);
  G.cash=Math.max(0,G.cash-fine); G.wanted=0; G.chaseT=0; G.stats.arrests++;
  let lost=[]; for(const k of ['handgun','shotgun']) if(G.owned[k]){delete G.owned[k];lost.push(WEAPONS[k].name);}

  toast('You turned yourself in. Fine of '+money(fine)+(lost.length?' and they kept your '+lost.join(' and '):'')+'. No stock seized.','cop');
}

function openRival(n){ const r=G.rivals.find(r=>r.id===n.rival); if(r) openUI('rival',{id:r.id}); }
function rivalDef(id){ return RIVALDEF.find(d=>d.id===id); }
function rivalMeatOffer(r,m){
  const d=rivalDef(r.id);
  return MEAT[m.sp].base*(.45+.7*m.q/100)*(.86+r.rel/400)*M().meat*packMult()*(d.likes===m.sp?1.18:.9);
}

function rivalTalk(id){
  const r=G.rivals.find(x=>x.id===id), def=rivalDef(id);
  r.line=pick(def.lines);
  if(G.day!==r.talkT){ r.talkT=G.day; r.rel=clamp(r.rel+2,0,100); }
  renderUI();
}
function rivalStock(id){
  const r=G.rivals.find(x=>x.id===id), def=rivalDef(id);
  r.offer=[];
  for(let i=0;i<3;i++){
    const sp=chance(.55)?def.likes:pick(SPKEYS);
    const br=pick(Object.keys(SPECIES[sp].breeds));
    const grown=chance(.5)?1:0;
    const price=Math.round(SPECIES[sp].breeds[br].price*M().animal*(grown?1:.55)*(.85-r.rel/600));
    r.offer.push({sp,br,grown,sex:chance(.5)?'F':'M',price});
  }
  r.line='"Have a look. Cash only, and I do not do refunds."';
  renderUI();
}
function rivalSellTo(id,i){
  const r=G.rivals.find(x=>x.id===id), o=r.offer[i];
  if(!o) return;
  const pen=penFor(o.sp);
  if(!pen){ toast('No pen with room for that.','bad'); return; }
  if(G.cash<o.price){ toast('Not enough cash.','bad'); return; }
  G.cash-=o.price; spawnAnimal(o.sp,o.br,pen,o.sex,o.grown?SPECIES[o.sp].breeds[o.br].grow:0);
  r.offer.splice(i,1); r.rel=clamp(r.rel+4,0,100);
  toast('Bought from '+esc(r.name)+' for '+money(o.price)+'.','good'); renderUI();
}
function rivalBuyMeat(id,mid){
  const r=G.rivals.find(x=>x.id===id), m=G.meats.find(x=>x.id===mid);
  if(!m) return;
  const tot=rivalMeatOffer(r,m)*m.kg;
  G.cash+=tot; G.stats.earned+=tot; G.stats.sold++;
  G.meats.splice(G.meats.indexOf(m),1);
  r.rel=clamp(r.rel+5,0,100);
  toast('Moved '+m.kg.toFixed(1)+'kg to '+esc(r.name)+' for <b class="money">'+money(tot)+'</b>.','good');
  renderUI();
}
function rivalBuyAnimal(id,aid){
  const r=G.rivals.find(x=>x.id===id), a=G.animals.find(x=>x.id===aid);
  if(!a) return;
  const v=Math.round(liveValue(a)*1.12);
  G.cash+=v; removeAnimal(a); r.rel=clamp(r.rel+3,0,100);
  toast('Sold '+esc(a.name)+' to '+esc(r.name)+' for '+money(v)+'.','good'); renderUI();
}
function rivalPartner(id){
  const r=G.rivals.find(x=>x.id===id);
  if(r.partner||r.rel<60||G.rep<45) return;
  r.partner=true; r.rel=clamp(r.rel+10,0,100); G.rep=clamp(G.rep+4,0,100);
  r.line='"All right. My buyers are your buyers. I take eight percent and we both sleep fine."';
  toast('<b>'+esc(r.name)+' is now your partner.</b> More buyers at market, 8% off the top.','good');
  renderUI();
}
function rivalThreaten(id){
  const r=G.rivals.find(x=>x.id===id);
  r.rel=clamp(r.rel-28,0,100); r.partner=false;
  const n=G.npcs.find(n=>n.rival===id);
  if(chance(.5)&&n){ n.aggro=true; n.weapon=chance(.4)?'handgun':'bat'; r.line='"You want to do this here?"'; toast('<b>'+esc(r.name)+' squares up.</b>','bad'); closeUI(); }
  else { r.line='"...Say that again and see what happens."'; toast(esc(r.name)+' will not forget that.','bad'); renderUI(); }
}

/* =========================================================================
   MEAT MARKET  -  listing, buyers arriving, haggling
   ========================================================================= */
function openMarket(){
  G.market={listed:{},buyers:[],pending:[],phase:'idle',filter:true,note:'',tick:0,round:0};
  // pre-list everything, it is what people want 90% of the time
  for(const m of G.meats) G.market.listed[m.id]=1;
  openUI('market');
}
function listedLots(){ return G.meats.filter(m=>G.market.listed[m.id]); }
function mktToggle(id){ const m=G.market; if(m.listed[id]) delete m.listed[id]; else m.listed[id]=1; renderUI(); }
function mktAll(on){ const m=G.market; m.listed={}; if(on) for(const l of G.meats) m.listed[l.id]=1; renderUI(); }
function mktFilter(){ G.market.filter=!G.market.filter; renderUI(); }
function partnerOf(){ return G.rivals.find(r=>r.partner&&!r.dead)||null; }

function mktCall(){
  const m=G.market, lots=listedLots();
  if(!lots.length){ toast('Put something on the board first.','bad'); return; }
  m.buyers=[]; m.pending=[]; m.note=''; m.round++;
  const partners=G.rivals.filter(r=>r.partner&&!r.dead).length;
  let n=2+Math.floor(G.rep/22)+partners+ri(0,1);
  if(G.rep<20) n=ri(0,2);
  n=clamp(n,0,7);
  for(let i=0;i<n;i++) m.pending.push(rnd(1.4,5.0));
  m.phase=n?'waiting':'done';
  if(!n) m.note='Nobody came to the board. Word about your meat has gotten around.';
  renderUI();
}
function makeBuyer(){
  const m=G.market, lots=listedLots();
  if(!lots.length) return null;
  const b={id:uid(),name:npcName(),mult:1,patience:1+(G.rep>=55?1:0)+ri(0,1),mood:'',status:'',leave:rnd(18,34)};
  if(!m.filter&&chance(.38)){
    const sp=pick(Object.keys(MEAT)), match=lots.filter(l=>l.sp===sp);
    if(!match.length){
      b.miss=true; b.sp=sp; b.leave=rnd(7,12);
      b.status='"You got any '+MEAT[sp].name.toLowerCase()+'? No? Then I am wasting both our time."';
      b.mood='not interested in your stock';
      return b;
    }
    b.lot=pick(match).id;
  } else b.lot=pick(lots).id;
  const lot=G.meats.find(x=>x.id===b.lot);
  if(!lot) return null;
  b.sp=lot.sp; b.q=lot.q;
  if(lot.q<45&&chance(clamp(.3+(45-G.rep)/110,0,.8))) return {refused:true,q:lot.q,name:b.name};
  let per=MEAT[lot.sp].base*M().meat*packMult();
  per*=.45+.75*(lot.q/100);
  per*=.6+.7*(G.rep/100);
  if(partnerOf()) per*=1.08;
  per*=rnd(.9,1.1);
  if(lot.q<45){ per*=.62; b.mood='suspicious'; b.status='"That colour is not right. Half price or I walk."'; }
  else if(G.rep<25){ per*=.82; b.mood='wary'; b.status='"I have heard things about your operation. That is my price."'; }
  else if(lot.q>=85){ b.mood='keen'; b.status='"Now that is a proper carcass."'; }
  else b.status=pick(['"That is my offer."','"Fair price for what it is."','"I can move that today."','"Take it or leave it."']);
  b.base=per; b.per=per;
  b.maxMult=1.04+G.rep/300+rnd(0,.18)+(lot.q>=85?.08:0);
  b.qty=Math.max(1,Math.round(lot.kg*rnd(.3,1)*10)/10);
  return b;
}
function updateMarket(dt){
  const m=G.market; if(!m) return;
  let dirty=false;
  for(let i=m.pending.length-1;i>=0;i--){
    m.pending[i]-=dt;
    if(m.pending[i]<=0){
      m.pending.splice(i,1);
      const b=makeBuyer();
      if(b&&b.refused){ m.note='A buyer took one look at your '+qLabel(b.q)[0].toLowerCase()+' cuts and kept walking.'; }
      else if(b) m.buyers.push(b);
      dirty=true;
    }
  }
  for(let i=m.buyers.length-1;i>=0;i--){
    const b=m.buyers[i]; b.leave-=dt;
    if(!b.miss&&!G.meats.some(l=>l.id===b.lot)){ m.buyers.splice(i,1); dirty=true; continue; }
    if(b.leave<=0){ m.buyers.splice(i,1); m.note=b.name+' got bored and left.'; dirty=true; }
  }
  if(m.phase==='waiting'&&!m.pending.length&&!m.buyers.length) { m.phase='done'; dirty=true; }
  m.tick+=dt;
  if(dirty||m.tick>.35){ m.tick=0; renderUI(); }
}
function mktRemove(id){ const m=G.market; const i=m.buyers.findIndex(b=>b.id===id); if(i>=0) m.buyers.splice(i,1); }
function mktAccept(id){
  const m=G.market, b=m.buyers.find(x=>x.id===id); if(!b||b.miss) return;
  const lot=G.meats.find(x=>x.id===b.lot);
  if(!lot){ mktRemove(id); renderUI(); return; }
  const qty=Math.min(b.qty,lot.kg);
  const gross=qty*b.per;
  const partner=partnerOf();
  const cut=partner?gross*.08:0;
  G.cash+=gross-cut; G.stats.earned+=gross-cut; G.stats.sold++;
  lot.kg=Math.round((lot.kg-qty)*10)/10;
  if(lot.kg<=.05){ G.meats.splice(G.meats.indexOf(lot),1); delete m.listed[lot.id]; }
  let dr = lot.q>=85?1.8 : lot.q>=68?1.0 : lot.q>=45?.1 : -3.2;
  if(b.mult>1.28) dr-=.5;
  G.rep=clamp(G.rep+dr,0,100);
  m.note='Sold '+qty.toFixed(1)+'kg to '+b.name+' at '+money(b.per)+'/kg &mdash; <b class="money">'+money(gross-cut)+'</b>'+
         (cut?' after '+esc(partner.name)+' took '+money(cut):'')+'. Reputation '+(dr>=0?'+':'')+dr.toFixed(1)+'.';
  toast('Deal closed: <b class="money">'+money(gross-cut)+'</b>',dr>=0?'good':'bad');
  mktRemove(id); renderUI();
}
function mktCounter(id,pct){
  const m=G.market, b=m.buyers.find(x=>x.id===id); if(!b||b.miss) return;
  const nm=b.mult*(1+pct/100);
  if(nm<=b.maxMult){
    b.mult=nm; b.per=b.base*nm; b.mood='agreeable';
    b.status=pick(['"Fine. '+money(b.per)+' a kilo and we are done."','"You drive a hard bargain. Done."','"All right, all right. '+money(b.per)+'."']);
  }else{
    b.patience--;
    if(b.patience<=0){
      b.mood='leaving'; b.status='"Forget it. Somebody else will sell to me."'; b.leave=Math.min(b.leave,1.6);
    }else{
      b.mood='annoyed';
      b.status=pick(['"That is robbery and you know it."','"No. My price stands."','"You are dreaming. Same offer."','"Try that again and I walk."']);
    }
  }
  renderUI();
}
function mktDecline(id){
  const m=G.market, b=m.buyers.find(x=>x.id===id);
  if(b) m.note='You waved '+b.name+' off.';
  mktRemove(id); renderUI();
}
UIS.market=()=>{
  const m=G.market, partner=partnerOf();
  const lots=G.meats.map(l=>{
    const L=qLabel(l.q), on=!!m.listed[l.id];
    const est=MEAT[l.sp].base*M().meat*packMult()*(.45+.75*l.q/100)*(.6+.7*G.rep/100);
    return '<div class="row '+(on?'sel':'')+'"><b>'+esc(l.name)+'</b> <span class="q '+L[1]+'">'+L[0]+' '+Math.round(l.q)+'</span>'+
      '<span class="spacer"></span><s style="color:#8a9a78">'+l.kg.toFixed(1)+'kg &middot; ~'+money(est)+'/kg</s>'+
      '<button class="btn sm '+(on?'on':'')+'" onclick="mktToggle('+l.id+')">'+(on?'LISTED':'LIST')+'</button></div>';
  }).join('')||'<div class="empty">Cold store is empty. Slaughter something first.</div>';

  let right='';

  else if(m.phase==='done'&&!m.buyers.length) right='<div class="empty">The floor has cleared. Call again when you are ready.</div>';

  right+=m.buyers.map(b=>{

      '<div style="margin-top:6px"><button class="btn sm" onclick="mktDecline('+b.id+')">WAVE THEM OFF</button></div></div>';

    const L=qLabel(lot.q);

    return '<div class="row" style="display:block"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
      '<b>'+esc(b.name)+'</b><span class="q '+L[1]+'">'+MEAT[b.sp].name+' '+L[0]+'</span>'+
      '<span class="spacer"></span><s style="color:#8a9a78">wants '+Math.min(b.qty,lot.kg).toFixed(1)+'kg</s></div>'+
      '<div style="display:flex;align-items:baseline;gap:10px;margin:6px 0 2px"><b class="money" style="font-size:17px">'+money(b.per)+'/kg</b>'+
      '<span style="color:#c3cfb2">= '+money(total)+'</span>'+
      (b.mult>1?'<span style="color:#8fd66a;font-size:11px">+'+Math.round((b.mult-1)*100)+'% from opening</span>':'')+
      '<span class="spacer"></span><span class="mood">patience '+'&#9679;'.repeat(Math.max(0,b.patience))+'</span></div>'+
      '<div class="mood" style="margin-bottom:7px">'+esc(b.status)+'</div>'+
      '<div style="display:flex;gap:5px;flex-wrap:wrap">'+
      '<button class="btn buy sm" onclick="mktAccept('+b.id+')">ACCEPT '+money(total)+'</button>'+
      '<button class="btn sm" onclick="mktCounter('+b.id+',5)">ASK +5%</button>'+
      '<button class="btn sm" onclick="mktCounter('+b.id+',15)">ASK +15%</button>'+
      '<button class="btn sm" onclick="mktCounter('+b.id+',25)">ASK +25%</button>'+
      '<button class="btn dang sm" onclick="mktDecline('+b.id+')">DECLINE</button></div></div>';
  }).join('');

  const listedKg=listedLots().reduce((t,l)=>t+l.kg,0);
  return panel('MEAT MARKET','Reputation '+Math.round(G.rep)+' &mdash; '+repWord()+(partner?' &middot; partnered with '+esc(partner.name):''),
    '<div class="cols"><div><div class="h4">YOUR COLD STORE</div>'+lots+
    '<div style="display:flex;gap:6px;margin:10px 0;flex-wrap:wrap">'+
    '<button class="btn sm" onclick="mktAll(1)">LIST ALL</button>'+
    '<button class="btn sm" onclick="mktAll(0)">CLEAR</button>'+
    '<div class="chk '+(m.filter?'on':'')+'" onclick="mktFilter()"><i></i> Only buyers for what I am selling</div></div>'+
    '<div style="font-size:11.5px;color:#8a9a78;line-height:1.5">'+(m.filter
      ? 'Filter on: every buyer who walks up will be after meat you actually have listed.'
      : 'Filter off: strangers will turn up asking for cuts you are not selling. More footfall, more time wasted.')+'</div>'+
    '<button class="btn buy" style="width:100%;margin-top:12px;padding:9px" '+(listedKg>0?'':'disabled')+' onclick="mktCall()">'+
      (m.round?'CALL THE FLOOR AGAIN':'CALL THE FLOOR')+' &mdash; '+listedKg.toFixed(1)+'kg LISTED</button>'+
    '</div><div><div class="h4">BUYERS</div>'+right+
    (m.note?'<div class="dlg" style="margin-top:10px">'+m.note+'</div>':'')+

function makePattern(base,dots){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,128,128);
  for(let i=0;i<420;i++){
    g.fillStyle=dots[i%dots.length];
    const x=Math.random()*128,y=Math.random()*128,w=Math.random()*3+1;
    g.fillRect(x,y,w,w);
  }
  return X.createPattern(c,'repeat');
}
let PAT_GRASS=null,PAT_DIRT=null;
function initPatterns(){
  PAT_GRASS=makePattern('#4c6b34',['#56793c','#425c2c','#5d8241','#3c5528']);
  PAT_DIRT =makePattern('#6d6555',['#7a7261','#5f584a','#837a68','#544e42']);
}
function roundRect(x,y,w,h,r){
  X.beginPath();

  X.arcTo(x,y+h,x,y,r); X.arcTo(x,y,x+w,y,r); X.closePath();
}
function shadow(x,y,w,h){ X.fillStyle='rgba(0,0,0,.24)'; X.beginPath(); X.ellipse(x,y,w,h,0,0,7); X.fill(); }
